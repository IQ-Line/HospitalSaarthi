name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: citusdata/citus:12.1
        env:
          POSTGRES_USER: hims
          POSTGRES_PASSWORD: hims
          POSTGRES_DB: hims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hims"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      cerbos:
        image: ghcr.io/cerbos/cerbos:0.53.0
        ports:
          - 3593:3593

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v5

      - uses: nrwl/nx-set-shas@v4

      # Stage 1: Static analysis
      - name: Lint
        run: npx nx affected -t lint --parallel=3

      # Stage 1b: Drizzle schema-drift gate — every module's src/schema/tables.ts (source of truth)
      # must match its committed migrations. Closes the "tables.ts vs SQL drift, no gate" gap.
      - name: Drizzle migration drift check
        run: |
          for cfg in modules/*/drizzle.config.ts; do
            mod=$(dirname "$cfg")
            echo "drizzle-kit generate :: $mod"
            (cd "$mod" && pnpm exec drizzle-kit generate)
          done
          drift="$(git status --porcelain | grep -E ' modules/[^/]+/migrations/' || true)"
          if [ -n "$drift" ]; then
            echo "::error::Drizzle drift: a module's src/schema/tables.ts changed without a committed migration. Run 'nx run <module>:db-generate' and commit the generated migration."
            echo "$drift"
            exit 1
          fi
          echo "No drizzle schema drift — tables.ts matches committed migrations."

      # Stage 1c: Report-contract codegen drift gate — the pdf-client (TS) and
      # opd (Python) report types are generated from the vendored JSON-Schema
      # contract; fail if the committed output is stale vs. a fresh regen.
      - name: Report contract codegen drift check
        run: make check-report-contracts

      # Stage 2: Type checking
      - name: Typecheck
        run: npx nx affected -t typecheck --parallel=3

      # Stage 3: Spec validation (User Management OpenAPI ↔ runtime contract)
      - name: Validate specs
        run: npx nx run user-management-svc:validate-spec

      # Stage 4: Unit tests
      - name: Test
        run: npx nx affected -t test --parallel=2

      # Stage 4b: Cerbos policy compile + governance tests (PDP contract)
      - name: Cerbos policies (compile + tests)
        run: >-
          docker run --rm
          -v "${{ github.workspace }}/infra/cerbos:/work"
          ghcr.io/cerbos/cerbos:0.53.0
          compile --tests=/work/tests /work/policies --verbose

      # Stage 5: Integration tests (real-DB, opt-in via TEST_DATABASE_URL).
      # One database PER MODULE on the Citus service: each module's integration
      # harness drops + recreates the shared `drizzle` migration schema in
      # beforeAll, so a single shared DB would race across modules. The
      # test:integration targets default TEST_DATABASE_URL to
      # postgresql://hims:hims@127.0.0.1:5432/hims_test_<module> (override the
      # base locally with TEST_DATABASE_BASE_URL, e.g. the hims-verify Citus).
      - name: Create per-module integration databases
        env:
          PGPASSWORD: hims
        run: |
          for db in registration pharmacy user_management configurator empi billing record_foundation; do
            psql -h 127.0.0.1 -U hims -d hims_test -c "CREATE DATABASE hims_test_$db;"
            psql -h 127.0.0.1 -U hims -d "hims_test_$db" -c "CREATE EXTENSION IF NOT EXISTS citus;"
          done
      - name: Integration tests
        run: npx nx affected -t test:integration --parallel=2

      # Stage 6: E2E tests (when applicable)
      # - name: E2E tests
      #   run: npx nx affected -t e2e

      # Stage 7: AI code review (when configured)
      # - name: AI code review
      #   run: npx nx affected -t ai-review
