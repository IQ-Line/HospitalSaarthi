[project]
name = "hims-opd"
version = "0.1.0"
description = "OPD module for the HIMS platform."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "azure-storage-blob",
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "pyjwt[crypto]",
    "httpx",
    "python-multipart",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "httpx",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests", "alembic"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
