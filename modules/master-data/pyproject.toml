[project]
name = "hims-master-data"
version = "0.1.0"
description = "Master Data service for the HIMS platform."
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi",
    "hims_sdk_authz",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "pyjwt",
    "sqlalchemy",
    "uvicorn[standard]",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
hims_sdk_authz = { path = "../../packages/py-sdk-authz", editable = true }

[dependency-groups]
dev = [
    "cryptography",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The squash baseline (and any migration) embeds authoritative DDL + seed data as SQL
# string literals; line-length is noise there and wrapping would chop the SQL. All other
# rules (unused imports, bugbear, pyupgrade, ...) still apply to migration files.
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
