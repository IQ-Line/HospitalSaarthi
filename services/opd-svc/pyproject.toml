[project]
name = "hims-opd-svc"
version = "0.1.0"
description = "Deployment wrapper for the HIMS OPD module."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "hims-opd",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opd_svc"]

[tool.uv.sources]
hims-opd = { path = "../../modules/opd", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
