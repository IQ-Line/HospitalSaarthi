[project]
name = "hims-master-data-svc"
version = "0.1.0"
description = "Deployment wrapper for the HIMS Master Data module."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "hims-master-data",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/master_data_svc"]

[tool.uv.sources]
hims-master-data = { path = "../../modules/master-data", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
