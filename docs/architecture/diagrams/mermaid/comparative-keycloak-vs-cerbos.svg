<text x="1059.1275" y="527.5" text-anchor="middle" dy="0.35em" font-size="11" font-weight="400" fill="var(--_text-muted)">Latency: &lt;1ms (in-memory, loopback)&lt;br/&gt;No SPOF: each pod has its own PDP&lt;br/&gt;Policies: Git-versioned, PR-reviewed, CI-tested&lt;br/&gt;Memory: ~30–50MB per sidecar</text>
