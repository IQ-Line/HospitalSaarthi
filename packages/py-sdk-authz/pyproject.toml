[project]
name = "hims_sdk_authz"
version = "0.1.0"
description = "Python Cerbos authorization SDK for HIMS — CerbosClient wrapper, ASGI principal middleware, FastAPI authz dependency."
requires-python = ">=3.12"
dependencies = [
    "cerbos>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "starlette>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
