[project]
name = "hims_sdk_authz"
version = "0.1.0"
description = "Python authorization PEP for HIMS FastAPI services — in-process RS256/JWKS JWT verification, HTTP-first principal enrichment from User Management, and per-resource Cerbos checks. Mirrors @hims/ts-sdk-identity + @hims/ts-sdk-authz."
requires-python = ">=3.12"
dependencies = [
    "cerbos>=0.15.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    # >=2.10.0: earlier PyJWT rejects a LIST issuer (list-issuer support landed in 2.10),
    # which would fail-closed-reject every token since the verifier always passes an allowlist.
    "pyjwt>=2.10.0",
    "starlette>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query()/etc. in argument
# defaults; these are not the mutable-default footgun B008 targets. Whitelisting
# them is the FastAPI-canonical fix (see fastapi.tiangolo.com + ruff B008 docs).
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
