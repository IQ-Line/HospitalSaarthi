[project]
name = "hims_sdk_abha"
version = "0.1.0"
description = "Python mirror of @hims/ts-sdk-abha — ABHA domain types and constants. Implementation pending until first Python service touches ABDM."
requires-python = ">=3.12"
dependencies = [
    "hims_sdk_fhir",
]

[tool.uv.sources]
hims_sdk_fhir = { path = "../py-sdk-fhir", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
