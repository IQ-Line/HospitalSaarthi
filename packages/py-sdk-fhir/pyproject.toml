[project]
name = "hims_sdk_fhir"
version = "0.1.0"
description = "Python mirror of @hims/ts-sdk-fhir — FHIR R4 + NRCeS profile primitives and HI-Type Document Bundle composers (OP Consultation, Prescription, Immunization, Health Document)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
