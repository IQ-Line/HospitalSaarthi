apiVersion: v1
kind: Namespace
metadata:
  name: hims
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hims-config
  namespace: himsv2
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  ENABLE_AUTH: "true"
  EVENT_BUS_TYPE: "in-process"
  CERBOS_URL: "cerbos.himsv2.svc.cluster.local:3593"
  JWKS_URL: "https://hims.example.com/api/auth/.well-known/jwks.json"
  JWT_ISSUER: "https://hims.example.com"
  JWT_AUDIENCE: "hims-platform"
  AUTH_BASE_URL: "https://hims.example.com"
  AUTH_TRUSTED_ORIGINS: "https://hims.example.com"
  CORS_ORIGINS: "https://hims.example.com"
  USER_MANAGEMENT_URL: "http://user-management-svc.himsv2.svc.cluster.local:3005"
  CONFIGURATOR_URL: "http://configurator-svc.himsv2.svc.cluster.local:3001"
  EMPI_URL: "http://empi-svc.himsv2.svc.cluster.local:3002"
  BILLING_URL: "http://billing-svc.himsv2.svc.cluster.local:3003"
  REGISTRATION_URL: "http://registration-svc.himsv2.svc.cluster.local:3006"
  OPD_URL: "http://opd-svc.himsv2.svc.cluster.local:8020"
  PHARMACY_URL: "http://pharmacy-svc.himsv2.svc.cluster.local:3004"
  INTEGRATION_HUB_URL: "http://integration-hub-svc.himsv2.svc.cluster.local:3007"
  EMPI_BASE_URL: "http://empi-svc.himsv2.svc.cluster.local:3002"
  RECORD_FOUNDATION_BASE_URL: "http://record-foundation-svc.himsv2.svc.cluster.local:3009"
  # Public origin for NHA callbacks (/api/v3) and M3 dataPushUrl — match AUTH_BASE_URL host
  INTEGRATION_HUB_PUBLIC_BASE_URL: "https://hims.example.com"
  # registration-svc OPD slip/receipt PDFs; opd-svc clinical reports (internal pdf-worker; not via Ingress)
  PDF_PLATFORM_URL: "http://pdf-worker.himsv2.svc.cluster.local:8091"
  # Public web origin for report assets (logo) inlined before PDF render — match AUTH_BASE_URL host
  REPORT_WEB_ORIGIN: "https://hims.example.com"
  REPORT_LOGO_URL: "/reportLogo.svg"
  MASTER_DATA_URL: "http://master-data.himsv2.svc.cluster.local:8010"
  VISITS_STUB: "true"
  MASTER_DATA_API_PREFIX: "/api/v1/master-data"
  MASTER_DATA_LOG_LEVEL: "INFO"
  ABDM_GATEWAY_BASE_URL: "https://dev.abdm.gov.in"
  ABDM_ABHA_API_BASE_URL: "https://abhasbx.abdm.gov.in/abha/api"
  ABDM_X_CM_ID: "sbx"
  CONFIGURATOR_INTERNAL_API_KEY: "ccbe8b361dd84fc160374d5a439d60adc564015ff2fd130fed8999a6b3d0252b"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerbos
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cerbos
  template:
    metadata:
      labels:
        app: cerbos
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
       agentpool: himsv2
      containers:
        - name: cerbos
          image: acriqline.azurecr.io/cerbos:dev-latest
          ports:
            - name: grpc
              containerPort: 3593
            - name: http
              containerPort: 3592
          livenessProbe:
            httpGet:
              path: /_cerbos/health
              port: http
          readinessProbe:
            httpGet:
              path: /_cerbos/health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cerbos
  namespace: himsv2
spec:
  selector:
    app: cerbos
  ports:
    - name: grpc
      port: 3593
      targetPort: grpc
    - name: http
      port: 3592
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
       agentpool: himsv2
      containers:
        - name: bff
          image: acriqline.azurecr.io/bff:dev-latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: hims-config
            - secretRef:
                name: hims-secrets
          env:
            - name: BFF_PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: himsv2
spec:
  selector:
    app: bff
  ports:
    - name: http
      port: 3000
      targetPort: http
---
