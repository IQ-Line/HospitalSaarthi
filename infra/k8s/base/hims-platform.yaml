      nodeSelector:
       agentpool: himsv2
      containers:
        - name: configurator-svc
          image: acriqline.azurecr.io/configurator-svc:dev-latest
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: hims-config
            - secretRef:
                name: hims-secrets
          env:
            - name: CONFIGURATOR_SVC_PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hims-secrets
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
