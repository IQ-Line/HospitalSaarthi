apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hims
  namespace: himsv2
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: hims.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 3000
          - path: /_cerbos
            pathType: Prefix
            backend:
              service:
                name: cerbos
                port:
                  number: 3592
          - path: /
            pathType: Prefix
            backend:
              service:
