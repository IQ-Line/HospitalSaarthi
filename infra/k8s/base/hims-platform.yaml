apiVersion: v1
kind: Namespace
metadata:
  name: hims
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hims-config
  namespace: himsv2
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  ENABLE_AUTH: "true"
  EVENT_BUS_TYPE: "in-process"
  CERBOS_URL: "cerbos.himsv2.svc.cluster.local:3593"
  JWKS_URL: "https://hims.example.com/api/auth/.well-known/jwks.json"
  JWT_ISSUER: "https://hims.example.com"
  JWT_AUDIENCE: "hims-platform"
  AUTH_BASE_URL: "https://hims.example.com"
  AUTH_TRUSTED_ORIGINS: "https://hims.example.com"
  CORS_ORIGINS: "https://hims.example.com"
  USER_MANAGEMENT_URL: "http://user-management-svc.himsv2.svc.cluster.local:3005"
  CONFIGURATOR_URL: "http://configurator-svc.himsv2.svc.cluster.local:3001"
  EMPI_URL: "http://empi-svc.himsv2.svc.cluster.local:3002"
  BILLING_URL: "http://billing-svc.himsv2.svc.cluster.local:3003"
  REGISTRATION_URL: "http://registration-svc.himsv2.svc.cluster.local:3006"
  MASTER_DATA_URL: "http://master-data.himsv2.svc.cluster.local:8010"
  VISITS_STUB: "true"
  MASTER_DATA_API_PREFIX: "/api/v1/master-data"
  MASTER_DATA_LOG_LEVEL: "INFO"
  ABDM_GATEWAY_BASE_URL: "https://dev.abdm.gov.in"
  ABDM_ABHA_API_BASE_URL: "https://abhasbx.abdm.gov.in/abha/api"
  ABDM_X_CM_ID: "sbx"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerbos
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cerbos
  template:
    metadata:
      labels:
        app: cerbos
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
       agentpool: himsv2
      containers:
        - name: cerbos
          image: acriqline.azurecr.io/cerbos:dev-latest
          ports:
            - name: grpc
              containerPort: 3593
            - name: http
              containerPort: 3592
          livenessProbe:
            httpGet:
              path: /_cerbos/health
              port: http
          readinessProbe:
            httpGet:
              path: /_cerbos/health
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cerbos
  namespace: himsv2
spec:
  selector:
    app: cerbos
  ports:
    - name: grpc
      port: 3593
      targetPort: grpc
    - name: http
      port: 3592
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
       agentpool: himsv2
      containers:
        - name: bff
          image: acriqline.azurecr.io/bff:dev-latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: hims-config
            - secretRef:
                name: hims-secrets
          env:
            - name: BFF_PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: himsv2
spec:
  selector:
    app: bff
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
       agentpool: himsv2
      containers:
        - name: web
          image: acriqline.azurecr.io/web:dev-latest
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: himsv2
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configurator-svc
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
