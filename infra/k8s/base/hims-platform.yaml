       agentpool: himsv2
      containers:
        - name: user-management-svc
          image: acriqline.azurecr.io/user-management-svc:dev-latest
          ports:
            - name: http
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: hims-config
            - secretRef:
                name: hims-secrets
          env:
            - name: USER_MANAGEMENT_SVC_PORT
              value: "3005"
            - name: USER_MGMT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hims-secrets
                  key: USER_MGMT_DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hims-secrets
                  key: BETTER_AUTH_SECRET
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
