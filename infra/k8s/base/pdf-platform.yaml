# PDF Platform — Gotenberg + pdf-worker (separate repo: pdf-platform)
# Apply after hims-platform.yaml. Cluster-internal only; registration-svc calls pdf-worker.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
        agentpool: himsv2
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.21.0
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
  namespace: himsv2
spec:
  selector:
    app: gotenberg
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-worker
  namespace: himsv2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-worker
  template:
    metadata:
      labels:
        app: pdf-worker
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      nodeSelector:
        agentpool: himsv2
      containers:
        - name: pdf-worker
          # Build: pdf-platform repo → infra/docker/pdf-worker/Dockerfile → push to ACR
          image: acriqline.azurecr.io/pdf-worker:dev-latest
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8091"
            - name: LOG_LEVEL
              value: "info"
            - name: GOTENBERG_URL
              value: "http://gotenberg.himsv2.svc.cluster.local:3000"
            - name: GOTENBERG_TIMEOUT_MS
              value: "120000"
            - name: REQUEST_TIMEOUT_MS
              value: "130000"
            - name: MAX_BODY_BYTES
              value: "5242880"
            - name: RENDER_MAX_CONCURRENCY
              value: "10"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-worker
  namespace: himsv2
spec:
  selector:
    app: pdf-worker
  ports:
    - name: http
      port: 8091
      targetPort: http
