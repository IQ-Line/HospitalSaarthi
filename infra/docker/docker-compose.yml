services:
  postgres:
    image: citusdata/citus:12.1
    container_name: hims-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hims
      POSTGRES_PASSWORD: hims
      POSTGRES_DB: hims_dev
    # Host 15432 avoids clashing with native Postgres clusters on 5432–5437 (common on Windows dev machines).
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/citus-init.sql:/docker-entrypoint-initdb.d/01-citus-init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hims -d hims_dev']
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    # bitnami/pgbouncer public tags were moved to bitnamilegacy (Broadcom catalog change).
    # TODO(infra): switch back to official bitnami namespace once stable tags return.
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    container_name: hims-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGBOUNCER_DATABASE: hims_dev
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: hims
      POSTGRESQL_PASSWORD: hims
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 200
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    ports:
      - '6432:6432'

  cerbos:
    image: ghcr.io/cerbos/cerbos:latest
    container_name: hims-cerbos
    restart: unless-stopped
    volumes:
      - ../cerbos/cerbos.yaml:/config/cerbos.yaml
      - ../cerbos/policies:/policies
    ports:
      - '3593:3593'
      - '3592:3592'
    command: ['server', '--config=/config/cerbos.yaml']

volumes:
  postgres_data:
