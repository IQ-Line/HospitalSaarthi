---
# Pharmacy dispense orders — custom counter dispense + manual billing (no payment integration v1).
# Capabilities: dispense:dispense:{read,update}
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "pharmacy_dispense_order"
  version: default
  rules:
    - actions:
        - "pharmacy.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "dispense:dispense:read" in request.principal.attr.capabilities ||
              "dispense:dispense:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "pharmacy.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "dispense:dispense:update" in request.principal.attr.capabilities ||
              "dispense:dispense:update" in request.principal.attr.delegated_capabilities
            )
