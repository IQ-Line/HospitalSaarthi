---
# Walk-in pharmacy dispense orders — counter patients without OPD visit / EMPI.
# Capabilities: dispense:dispense:{read,update}
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "pharmacy_walk_in_dispense_order"
  version: default
  rules:
    - actions:
        - "pharmacy.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "dispense:dispense:read" in request.principal.attr.capabilities ||
              "dispense:dispense:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "pharmacy.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "dispense:dispense:read" in request.principal.attr.capabilities ||
              "dispense:dispense:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "pharmacy.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "dispense:dispense:update" in request.principal.attr.capabilities ||
              "dispense:dispense:update" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "pharmacy.update"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "dispense:dispense:update" in request.principal.attr.capabilities ||
              "dispense:dispense:update" in request.principal.attr.delegated_capabilities
            )
