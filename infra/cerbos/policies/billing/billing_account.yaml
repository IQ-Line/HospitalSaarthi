---
# Billing — billing account / payment operations.
# Capabilities: billing-account:billing-account:{create,read,update,delete}
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "billing_account"
  version: default
  rules:
    - actions:
        - "billing-account.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "billing-account:billing-account:read" in request.principal.attr.capabilities ||
              "billing-account:billing-account:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "billing-account.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "billing-account:billing-account:read" in request.principal.attr.capabilities ||
              "billing-account:billing-account:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "billing-account.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "billing-account:billing-account:create" in request.principal.attr.capabilities ||
              "billing-account:billing-account:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "billing-account.create"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "billing-account:billing-account:create" in request.principal.attr.capabilities ||
              "billing-account:billing-account:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "billing-account.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "billing-account:billing-account:update" in request.principal.attr.capabilities ||
              "billing-account:billing-account:update" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "billing-account.update"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "billing-account:billing-account:update" in request.principal.attr.capabilities ||
              "billing-account:billing-account:update" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "billing-account.delete"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "billing-account:billing-account:delete" in request.principal.attr.capabilities ||
              "billing-account:billing-account:delete" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "billing-account.delete"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "billing-account:billing-account:delete" in request.principal.attr.capabilities ||
              "billing-account:billing-account:delete" in request.principal.attr.delegated_capabilities
            )
