---
# Billing — invoice / bill operations.
# Capabilities: invoice:invoice:{create,read,update,delete,override-price}
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "invoice"
  version: default
  rules:
    - actions:
        - "invoice.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "invoice:invoice:read" in request.principal.attr.capabilities ||
              "invoice:invoice:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "invoice.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "invoice:invoice:create" in request.principal.attr.capabilities ||
              "invoice:invoice:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "invoice.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "invoice:invoice:update" in request.principal.attr.capabilities ||
              "invoice:invoice:update" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "invoice.delete"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "invoice:invoice:delete" in request.principal.attr.capabilities ||
              "invoice:invoice:delete" in request.principal.attr.delegated_capabilities
            )

    # Privileged desk price/discount override on a charge — a distinct capability
    # from invoice.create so an ordinary charge-creator cannot rewrite prices (GH #94).
    - actions:
        - "invoice.override-price"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "invoice:invoice:override-price" in request.principal.attr.capabilities ||
              "invoice:invoice:override-price" in request.principal.attr.delegated_capabilities
            )
