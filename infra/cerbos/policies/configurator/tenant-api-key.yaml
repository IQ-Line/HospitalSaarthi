---
# Configurator tenant_api_key — platform provisioning surface (configurator schema).
# Capability-gated with NO tenant equality (capabilities are platform-operator scoped).
# Reads are authorization decisions here: "who may list a tenant's api-keys" is authz.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "configurator:tenant_api_key"
  version: default
  rules:
    - actions: ["create"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "configurator:tenant-api-key:create" in request.principal.attr.capabilities ||
            "configurator:tenant-api-key:create" in request.principal.attr.delegated_capabilities

    - actions: ["read"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "configurator:tenant-api-key:read" in request.principal.attr.capabilities ||
            "configurator:tenant-api-key:read" in request.principal.attr.delegated_capabilities

    - actions: ["update"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "configurator:tenant-api-key:update" in request.principal.attr.capabilities ||
            "configurator:tenant-api-key:update" in request.principal.attr.delegated_capabilities
