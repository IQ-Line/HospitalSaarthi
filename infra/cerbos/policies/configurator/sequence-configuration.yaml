---
# Configurator sequence_configuration — platform provisioning surface (configurator schema).
# Capability-gated with NO tenant equality (capabilities are platform-operator scoped).
# Reads are authorization decisions here: configurator serves cross-tenant platform-admin data.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "configurator:sequence_configuration"
  version: default
  rules:
    - actions: ["read"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "configurator:sequence-configuration:read" in request.principal.attr.capabilities ||
            "configurator:sequence-configuration:read" in request.principal.attr.delegated_capabilities

    - actions: ["update"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "configurator:sequence-configuration:update" in request.principal.attr.capabilities ||
            "configurator:sequence-configuration:update" in request.principal.attr.delegated_capabilities

    # --- Bounded platform operator (scope:platform) — additive allow ---
    # Replaces the former god-mode super-admin: authority is the platform scope issued from
    # platform_admins membership (JWT `scopes` -> principal.attr.scopes), NOT a capability nor
    # the "super-admin" role string. No tenant equality — the operator is inherently
    # cross-tenant. Clinical policies (opd/pharmacy/registration/empi/inventory/billing)
    # intentionally omit this rule; that omission is the bound. Capability rules above are
    # untouched (delegated tenant-admins keep working).
    - actions: ["read", "update"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            has(request.principal.attr.scopes) &&
            "platform" in request.principal.attr.scopes
