---
# EMPI — patient identity and registration operations.
# Capabilities: empi:patient:{create,read,update,delete}
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "patient"
  version: default
  rules:
    - actions:
        - "patient.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "empi:patient:read" in request.principal.attr.capabilities ||
              "empi:patient:read" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "patient.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "patient.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "empi:patient:read" in request.principal.attr.capabilities ||
              "empi:patient:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "patient.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "empi:patient:create" in request.principal.attr.capabilities ||
              "empi:patient:create" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "patient.create"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "patient.create"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "empi:patient:create" in request.principal.attr.capabilities ||
              "empi:patient:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "patient.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "empi:patient:update" in request.principal.attr.capabilities ||
              "empi:patient:update" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "patient.update"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "patient.update"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "empi:patient:update" in request.principal.attr.capabilities ||
              "empi:patient:update" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "patient.delete"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "empi:patient:delete" in request.principal.attr.capabilities ||
              "empi:patient:delete" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "patient.delete"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "patient.delete"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "empi:patient:delete" in request.principal.attr.capabilities ||
              "empi:patient:delete" in request.principal.attr.delegated_capabilities
            )
