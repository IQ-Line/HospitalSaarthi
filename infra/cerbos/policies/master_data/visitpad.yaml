          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "master-data:visitpad:delete" in request.principal.attr.capabilities ||
              "master-data:visitpad:delete" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "visitpad.delete"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "master-data:visitpad:delete" in request.principal.attr.capabilities ||
              "master-data:visitpad:delete" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "visitpad.delete"
      roles: ["*"]
      effect: EFFECT_ALLOW
      name: cross-tenant-super-admin-visitpad-delete
      condition:
