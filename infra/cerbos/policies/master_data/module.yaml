---
# Master Data — global module catalog (platform-operator authored, master_global).
# Writes are capability-gated with NO tenant equality (the capabilities are platform-operator
# scoped); reads are identity-gate-only (not gated here). Mirrors master_data:visitpad.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "master_data:module"
  version: default
  rules:
    - actions: ["create"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:module:create" in request.principal.attr.capabilities ||
            "master-data:module:create" in request.principal.attr.delegated_capabilities

    - actions: ["update"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:module:update" in request.principal.attr.capabilities ||
            "master-data:module:update" in request.principal.attr.delegated_capabilities

    - actions: ["delete"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:module:delete" in request.principal.attr.capabilities ||
            "master-data:module:delete" in request.principal.attr.delegated_capabilities
