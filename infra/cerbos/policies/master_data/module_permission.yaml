---
# Master Data — global module-permission junction catalog (platform-operator authored,
# master_global). Capability-gated writes, no tenant equality; reads are identity-gate-only.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "master_data:module_permission"
  version: default
  rules:
    - actions: ["create"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:module-permission:create" in request.principal.attr.capabilities ||
            "master-data:module-permission:create" in request.principal.attr.delegated_capabilities

    - actions: ["update"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:module-permission:update" in request.principal.attr.capabilities ||
            "master-data:module-permission:update" in request.principal.attr.delegated_capabilities

    - actions: ["delete"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:module-permission:delete" in request.principal.attr.capabilities ||
            "master-data:module-permission:delete" in request.principal.attr.delegated_capabilities
