---
# Master Data — global system-role catalog (platform-operator authored, master_global).
# Capability-gated writes, no tenant equality; reads are identity-gate-only.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "master_data:system_role"
  version: default
  rules:
    - actions: ["create"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:system-role:create" in request.principal.attr.capabilities ||
            "master-data:system-role:create" in request.principal.attr.delegated_capabilities

    - actions: ["update"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:system-role:update" in request.principal.attr.capabilities ||
            "master-data:system-role:update" in request.principal.attr.delegated_capabilities

    - actions: ["delete"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:system-role:delete" in request.principal.attr.capabilities ||
            "master-data:system-role:delete" in request.principal.attr.delegated_capabilities
