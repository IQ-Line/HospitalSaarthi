            )

    - actions:
        - "catalog.delete"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "master-data:platform:delete" in request.principal.attr.capabilities ||
              "master-data:platform:delete" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "catalog.delete"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "catalog.delete"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
