    - actions:
        - "catalog.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "master-data:platform:update" in request.principal.attr.capabilities ||
              "master-data:platform:update" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "catalog.update"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "catalog.update"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "master-data:platform:update" in request.principal.attr.capabilities ||
