---
# Master Data — Platform global catalog CRUD.
# Capabilities: master-data:platform:{read,create,update,delete}
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "master_data:platform"
  version: default
  rules:
    - actions:
        - "catalog.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "master-data:platform:read" in request.principal.attr.capabilities ||
              "master-data:platform:read" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "catalog.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "catalog.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "master-data:platform:read" in request.principal.attr.capabilities ||
              "master-data:platform:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "catalog.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      name: cross-tenant-super-admin-catalog-read
      condition:
        match:
          expr: >-
            "super-admin" in request.principal.attr.role_codes &&
            (
              "master-data:platform:read" in request.principal.attr.capabilities ||
              "master-data:platform:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "catalog.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "master-data:platform:create" in request.principal.attr.capabilities ||
              "master-data:platform:create" in request.principal.attr.delegated_capabilities
            )

    # Super-admin unconditional bypass — no capability check needed
    - actions:
        - "catalog.create"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "catalog.create"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "master-data:platform:create" in request.principal.attr.capabilities ||
              "master-data:platform:create" in request.principal.attr.delegated_capabilities
