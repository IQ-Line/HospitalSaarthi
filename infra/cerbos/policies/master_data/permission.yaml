---
# Master Data — global permission catalog (platform-operator authored, master_global).
# Capability-gated writes, no tenant equality; reads are identity-gate-only.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "master_data:permission"
  version: default
  rules:
    - actions: ["create"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:permission:create" in request.principal.attr.capabilities ||
            "master-data:permission:create" in request.principal.attr.delegated_capabilities

    - actions: ["update"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:permission:update" in request.principal.attr.capabilities ||
            "master-data:permission:update" in request.principal.attr.delegated_capabilities

    - actions: ["delete"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            "master-data:permission:delete" in request.principal.attr.capabilities ||
            "master-data:permission:delete" in request.principal.attr.delegated_capabilities

    # --- Bounded platform operator (scope:platform) — additive allow ---
    # Replaces the former god-mode super-admin: authority is the platform scope issued from
    # platform_admins membership (JWT `scopes` -> principal.attr.scopes), NOT a capability nor
    # the "super-admin" role string. No tenant equality — the operator is inherently
    # cross-tenant. Clinical policies (opd/pharmacy/registration/empi/inventory/billing)
    # intentionally omit this rule; that omission is the bound. Capability rules above are
    # untouched (delegated tenant-admins keep working).
    - actions: ["create", "update", "delete"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            has(request.principal.attr.scopes) &&
            "platform" in request.principal.attr.scopes
