---
# User Management — ABAC: capabilities, delegated capabilities, department, clearance tiers.
#
# Policy contract (RBAC regression guard):
# - Do NOT authorize using Cerbos principal `roles` field alone. That field may be passed through
#   the PEP for identity/context only; all EFFECT_ALLOW rules here must use request.principal.attr
#   (tenant iq_tenant_id, capabilities or delegated_capabilities, department/clearances where applicable).
# - New rules must keep tenant alignment (principal.attr.iq_tenant_id vs resource.attr.iq_tenant_id)
#   and a capability or delegated_capability check; do not add role-name-only conditions.
#
# Capability grant: direct role_capabilities OR same string in delegated_capabilities (equivalent for authz).
# Principal clearance map: request.principal.attr.clearances.
# Effective tier: request.principal.attr.um_clearance_effective_tier.
# Resource sensitivity: request.resource.attr.required_clearance (0 = none, 1–3 = stronger).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "user"
  version: default
  rules:
    - actions:
        - "user.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "users:users:create" in request.principal.attr.capabilities ||
              "users:users:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "user.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "users:users:read" in request.principal.attr.capabilities ||
              "users:users:read" in request.principal.attr.delegated_capabilities
            ) &&
            (
              !has(request.resource.attr.department) ||
              request.resource.attr.department == null ||
              request.resource.attr.department == "" ||
              !has(request.principal.attr.department) ||
              request.principal.attr.department == null ||
              request.principal.attr.department == "" ||
              request.resource.attr.department == request.principal.attr.department
            ) &&
            (
              !has(request.resource.attr.required_clearance) ||
              request.resource.attr.required_clearance <= 0 ||
              (
                request.principal.attr.um_clearance_effective_tier >= request.resource.attr.required_clearance &&
                has(request.principal.attr.clearances) &&
                size(request.principal.attr.clearances) > 0
              )
            )

    - actions:
        - "user.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "users:users:update" in request.principal.attr.capabilities ||
              "users:users:update" in request.principal.attr.delegated_capabilities
            ) &&
            (
              !has(request.resource.attr.department) ||
              request.resource.attr.department == null ||
              request.resource.attr.department == "" ||
              !has(request.principal.attr.department) ||
              request.principal.attr.department == null ||
              request.principal.attr.department == "" ||
              request.resource.attr.department == request.principal.attr.department
            ) &&
            (
              !has(request.resource.attr.required_clearance) ||
              request.resource.attr.required_clearance <= 0 ||
              (
                request.principal.attr.um_clearance_effective_tier >= request.resource.attr.required_clearance &&
                has(request.principal.attr.clearances) &&
                size(request.principal.attr.clearances) > 0
              )
            )

    # Admin recovery Flow A (authn spec §3.5). Distinct action from user.update so policies can
    # separate account recovery from routine profile edits; capability gate currently reuses
    # users:users:update (task 9 may introduce a dedicated users:users:reset_password capability).
    - actions:
        - "user.reset_password"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "users:users:update" in request.principal.attr.capabilities ||
              "users:users:update" in request.principal.attr.delegated_capabilities
            ) &&
            (
              !has(request.resource.attr.department) ||
              request.resource.attr.department == null ||
              request.resource.attr.department == "" ||
              !has(request.principal.attr.department) ||
              request.principal.attr.department == null ||
              request.principal.attr.department == "" ||
              request.resource.attr.department == request.principal.attr.department
            ) &&
            (
              !has(request.resource.attr.required_clearance) ||
              request.resource.attr.required_clearance <= 0 ||
              (
                request.principal.attr.um_clearance_effective_tier >= request.resource.attr.required_clearance &&
                has(request.principal.attr.clearances) &&
                size(request.principal.attr.clearances) > 0
              )
            )

    - actions:
        - "user.deactivate"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "users:users:delete" in request.principal.attr.capabilities ||
              "users:users:delete" in request.principal.attr.delegated_capabilities
            ) &&
            (
              !has(request.resource.attr.department) ||
              request.resource.attr.department == null ||
              request.resource.attr.department == "" ||
              !has(request.principal.attr.department) ||
              request.principal.attr.department == null ||
              request.principal.attr.department == "" ||
              request.resource.attr.department == request.principal.attr.department
            ) &&
            (
              !has(request.resource.attr.required_clearance) ||
              request.resource.attr.required_clearance <= 0 ||
              (
                request.principal.attr.um_clearance_effective_tier >= request.resource.attr.required_clearance &&
                has(request.principal.attr.clearances) &&
                size(request.principal.attr.clearances) > 0
              )
            )

    - actions:
        - "user.activate"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "users:users:delete" in request.principal.attr.capabilities ||
              "users:users:delete" in request.principal.attr.delegated_capabilities
            ) &&
            (
              !has(request.resource.attr.department) ||
              request.resource.attr.department == null ||
              request.resource.attr.department == "" ||
              !has(request.principal.attr.department) ||
              request.principal.attr.department == null ||
              request.principal.attr.department == "" ||
              request.resource.attr.department == request.principal.attr.department
            ) &&
            (
              !has(request.resource.attr.required_clearance) ||
              request.resource.attr.required_clearance <= 0 ||
              (
                request.principal.attr.um_clearance_effective_tier >= request.resource.attr.required_clearance &&
                has(request.principal.attr.clearances) &&
                size(request.principal.attr.clearances) > 0
              )
            )

    # --- Bounded platform operator (scope:platform) — additive allow ---
    # Replaces the former god-mode super-admin: authority is the platform scope issued from
    # platform_admins membership (JWT `scopes` -> principal.attr.scopes), NOT a capability nor
    # the "super-admin" role string. No tenant equality — the operator is inherently
    # cross-tenant. Clinical policies (opd/pharmacy/registration/empi/inventory/billing)
    # intentionally omit this rule; that omission is the bound. Capability rules above are
    # untouched (delegated tenant-admins keep working).
    - actions: ["user.create", "user.read", "user.update", "user.reset_password", "user.deactivate", "user.activate"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            has(request.principal.attr.scopes) &&
            "platform" in request.principal.attr.scopes
