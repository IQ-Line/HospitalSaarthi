# User Management — Auth endpoints (UX/shell support)
#
# `/auth/me` and `/auth/principal` are used by the frontend to fetch the
# PDP-enriched principal snapshot (including runtime capability keys).
#
# These endpoints do not expose other users' clinical/operational data; they only
# support UX gating. They must therefore not depend on `users:users:read`.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "auth"
  version: default
  rules:
    # Bounded platform operator (scope:platform) reads its own principal snapshot with no
    # capability/tenant condition. Safe: the /auth/* endpoints return only the caller's own
    # enriched principal (capability hydration for the shell), never another user's data.
    # Authority is the platform scope (JWT `scopes` -> principal.attr.scopes), NOT the
    # "super-admin" role string. Every other action in every other policy gates on
    # request.principal.attr.capabilities. Do not copy the unconditional shape elsewhere.
    - actions:
        - "auth.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            has(request.principal.attr.scopes) &&
            "platform" in request.principal.attr.scopes

    - actions:
        - "auth.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id

