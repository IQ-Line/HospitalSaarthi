# User Management — Auth endpoints (UX/shell support)
#
# `/auth/me` and `/auth/principal` are used by the frontend to fetch the
# PDP-enriched principal snapshot (including runtime capability keys).
#
# These endpoints do not expose other users' clinical/operational data; they only
# support UX gating. They must therefore not depend on `users:users:read`.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "auth"
  version: default
  rules:
    # INTENTIONAL EXCEPTION — the only unconditional EFFECT_ALLOW in the platform's policy set.
    # super-admin reads its own principal snapshot with no capability/tenant condition. Safe: the
    # /auth/* endpoints return only the caller's own enriched principal (capability hydration for the
    # shell), never another user's data. Every other action in every other policy gates on
    # request.principal.attr.capabilities even for super-admin. Do not copy this shape elsewhere.
    - actions:
        - "auth.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW

    - actions:
        - "auth.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id

