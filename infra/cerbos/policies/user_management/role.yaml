---
# User Management — role definition and role composition operations.
# Policies authorize by tenant + capability keys only; role names are context, not grants.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "role"
  version: default
  rules:
    - actions:
        - "role.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "user-roles:user-roles:read" in request.principal.attr.capabilities ||
              "user-roles:user-roles:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "role.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "user-roles:user-roles:read" in request.principal.attr.capabilities ||
              "user-roles:user-roles:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "role.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "user-roles:user-roles:create" in request.principal.attr.capabilities ||
              "user-roles:user-roles:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "role.create"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "user-roles:user-roles:create" in request.principal.attr.capabilities ||
              "user-roles:user-roles:create" in request.principal.attr.delegated_capabilities
            )

    # Cross-tenant provisioning (tenant wizard): super-admin in principal.attr.role_codes + capability.
    - actions:
        - "role.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id != request.resource.attr.iq_tenant_id &&
            has(request.principal.attr.role_codes) &&
            "super-admin" in request.principal.attr.role_codes &&
            (
              "user-roles:user-roles:create" in request.principal.attr.capabilities ||
              "user-roles:user-roles:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "role.update"
        - "role.compose"
        - "role.delete"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "user-roles:user-roles:update" in request.principal.attr.capabilities ||
              "user-roles:user-roles:update" in request.principal.attr.delegated_capabilities ||
              "user-roles:user-roles:delete" in request.principal.attr.capabilities ||
              "user-roles:user-roles:delete" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "role.update"
        - "role.compose"
        - "role.delete"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "user-roles:user-roles:update" in request.principal.attr.capabilities ||
              "user-roles:user-roles:update" in request.principal.attr.delegated_capabilities ||
              "user-roles:user-roles:delete" in request.principal.attr.capabilities ||
              "user-roles:user-roles:delete" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "role.update"
        - "role.compose"
        - "role.delete"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id != request.resource.attr.iq_tenant_id &&
            has(request.principal.attr.role_codes) &&
            "super-admin" in request.principal.attr.role_codes &&
            (
              "user-roles:user-roles:update" in request.principal.attr.capabilities ||
              "user-roles:user-roles:update" in request.principal.attr.delegated_capabilities ||
              "user-roles:user-roles:delete" in request.principal.attr.capabilities ||
              "user-roles:user-roles:delete" in request.principal.attr.delegated_capabilities
            )

    # --- Bounded platform operator (scope:platform) — additive allow ---
    # Replaces the former god-mode super-admin: authority is the platform scope issued from
    # platform_admins membership (JWT `scopes` -> principal.attr.scopes), NOT a capability nor
    # the "super-admin" role string. No tenant equality — the operator is inherently
    # cross-tenant. Clinical policies (opd/pharmacy/registration/empi/inventory/billing)
    # intentionally omit this rule; that omission is the bound. Capability rules above are
    # untouched (delegated tenant-admins keep working).
    - actions: ["role.read", "role.create", "role.update", "role.compose", "role.delete"]
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            has(request.principal.attr.scopes) &&
            "platform" in request.principal.attr.scopes
