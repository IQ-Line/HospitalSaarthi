---
# Inventory — operational stores (locations that receive/dispense/issue stock).
# Capabilities: inventory:store:{read,create,update}.
# Tenant-scoped by iq_tenant_id equality; roles are context, capabilities are the grant.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "inventory_store"
  version: default
  rules:
    - actions:
        - "store.read"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "inventory:store:read" in request.principal.attr.capabilities ||
              "inventory:store:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "store.read"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "inventory:store:read" in request.principal.attr.capabilities ||
              "inventory:store:read" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "store.create"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "inventory:store:create" in request.principal.attr.capabilities ||
              "inventory:store:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "store.create"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "inventory:store:create" in request.principal.attr.capabilities ||
              "inventory:store:create" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "store.update"
      roles: ["*"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            request.principal.attr.iq_tenant_id == request.resource.attr.iq_tenant_id &&
            (
              "inventory:store:update" in request.principal.attr.capabilities ||
              "inventory:store:update" in request.principal.attr.delegated_capabilities
            )

    - actions:
        - "store.update"
      roles: ["super-admin"]
      effect: EFFECT_ALLOW
      condition:
        match:
          expr: >-
            (
              "inventory:store:update" in request.principal.attr.capabilities ||
              "inventory:store:update" in request.principal.attr.delegated_capabilities
            )
