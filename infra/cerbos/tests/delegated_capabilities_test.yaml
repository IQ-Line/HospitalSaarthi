# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/TestSuite.schema.json
---
name: delegated_capabilities
description: >-
  User Management — um:* granted only via delegated_capabilities authorizes like direct capabilities.

principals:
  delegated_only_list:
    id: svc-delegated-list
    roles:
      - "_unresolved"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      org_id: null
      department: null
      capabilities: []
      delegated_capabilities:
        - "users:users:read"
      clearances: {}
      um_clearance_effective_tier: 0

  delegated_only_create:
    id: svc-delegated-create
    roles:
      - "_unresolved"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      org_id: null
      department: null
      capabilities: []
      delegated_capabilities:
        - "users:users:create"
      clearances: {}
      um_clearance_effective_tier: 0

  no_caps:
    id: user-no-caps
    roles:
      - "_unresolved"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      org_id: null
      department: null
      capabilities: []
      delegated_capabilities: []
      clearances: {}
      um_clearance_effective_tier: 0

resources:
  user_list_aa:
    id: list
    kind: user
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      department: null
      required_clearance: 0

  user_new_aa:
    id: new
    kind: user
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      department: null
      required_clearance: 0

tests:
  - name: user.read(list) — delegated users:users:read ALLOW
    input:
      principals: [delegated_only_list]
      resources: [user_list_aa]
      actions: [user.read]
    expected:
      - principal: delegated_only_list
        resource: user_list_aa
        actions:
          user.read: EFFECT_ALLOW

  - name: user.read(list) — no capability nor delegation DENY
    input:
      principals: [no_caps]
      resources: [user_list_aa]
      actions: [user.read]
    expected:
      - principal: no_caps
        resource: user_list_aa
        actions:
          user.read: EFFECT_DENY

  - name: user.create — delegated users:users:create ALLOW
    input:
      principals: [delegated_only_create]
      resources: [user_new_aa]
      actions: [user.create]
    expected:
      - principal: delegated_only_create
        resource: user_new_aa
        actions:
          user.create: EFFECT_ALLOW

  - name: user.create — no delegation DENY
    input:
      principals: [no_caps]
      resources: [user_new_aa]
      actions: [user.create]
    expected:
      - principal: no_caps
        resource: user_new_aa
        actions:
          user.create: EFFECT_DENY
