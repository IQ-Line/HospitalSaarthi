# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/TestSuite.schema.json
---
name: auth_permissions_test
description: >-
  User Management — `/auth/*` endpoints are guarded by resource kind `auth`
  and action `auth.read`. Access depends only on tenant alignment.

principals:
  role_admin_only:
    id: um-role-admin
    roles:
      - "_unresolved"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      org_id: null
      department: null
      capabilities:
        - "user-roles:user-roles:create"
      delegated_capabilities: []
      clearances: {}
      um_clearance_effective_tier: 0

  # Bounded platform operator: authority is scopes:["platform"] alone. Home tenant differs from the
  # resource tenant to prove the scope (not tenant alignment) is what grants auth.read.
  platform_operator_scope:
    id: platform-operator
    roles:
      - "__hims_authenticated__"
    attr:
      iq_tenant_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc"
      org_id: null
      department: null
      role_codes: []
      scopes:
        - "platform"
      capabilities: []
      delegated_capabilities: []
      clearances: {}
      um_clearance_effective_tier: 0

  # Dead string: role/role_codes literally "super-admin" but NO platform scope. Must grant nothing.
  fake_super_admin_no_scope:
    id: tenant-impostor
    roles:
      - "super-admin"
    attr:
      iq_tenant_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc"
      org_id: null
      department: null
      role_codes:
        - "super-admin"
      scopes: []
      capabilities: []
      delegated_capabilities: []
      clearances: {}
      um_clearance_effective_tier: 0

resources:
  auth_self_ok:
    id: self
    kind: auth
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      department: null
      required_clearance: 0

  auth_self_wrong_tenant:
    id: self
    kind: auth
    attr:
      iq_tenant_id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"
      department: null
      required_clearance: 0

tests:
  - name: auth.read — allowed when tenant matches (even without users:users:read)
    input:
      principals: [role_admin_only]
      resources: [auth_self_ok]
      actions: [auth.read]
    expected:
      - principal: role_admin_only
        resource: auth_self_ok
        actions:
          auth.read: EFFECT_ALLOW

  - name: auth.read — denied when tenant mismatches
    input:
      principals: [role_admin_only]
      resources: [auth_self_wrong_tenant]
      actions: [auth.read]
    expected:
      - principal: role_admin_only
        resource: auth_self_wrong_tenant
        actions:
          auth.read: EFFECT_DENY

  - name: auth.read — allowed for platform-scope operator regardless of tenant
    input:
      principals: [platform_operator_scope]
      resources: [auth_self_wrong_tenant]
      actions: [auth.read]
    expected:
      - principal: platform_operator_scope
        resource: auth_self_wrong_tenant
        actions:
          auth.read: EFFECT_ALLOW

  - name: DEAD STRING — role "super-admin" WITHOUT scope denied auth.read cross-tenant
    input:
      principals: [fake_super_admin_no_scope]
      resources: [auth_self_wrong_tenant]
      actions: [auth.read]
    expected:
      - principal: fake_super_admin_no_scope
        resource: auth_self_wrong_tenant
        actions:
          auth.read: EFFECT_DENY

