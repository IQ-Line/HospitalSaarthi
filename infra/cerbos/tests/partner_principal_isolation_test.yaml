# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/TestSuite.schema.json
---
name: partner_principal_isolation_test
description: >-
  Partner principal orchestration — super-admin and tenant-admin via role; other
  principals need integration admin capability keys and tenant alignment.

principals:
  super_admin_cross_tenant:
    id: platform-operator
    roles:
      - "super-admin"
    attr:
      iq_tenant_id: "cccccccc-cccc-4ccc-8ccc-cccccccccccc"
      capabilities: []
      delegated_capabilities: []

  tenant_admin_role_only:
    id: hospital-admin
    roles:
      - "tenant-admin"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      capabilities: []
      delegated_capabilities: []

  activator_aa:
    id: admin-aa
    roles:
      - "tenant-admin"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      capabilities:
        - "integration:integration:activate"
      delegated_capabilities: []

  disabler_aa:
    id: admin-aa
    roles:
      - "tenant-admin"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      capabilities:
        - "integration:integration:disable"
      delegated_capabilities: []

  reader_only:
    id: staff-user
    roles:
      - "staff"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      capabilities:
        - "integration:integration:read"
      delegated_capabilities: []

resources:
  partner_aa:
    id: partner-1
    kind: partner_principal
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"

  partner_bb:
    id: partner-2
    kind: partner_principal
    attr:
      iq_tenant_id: "bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb"

tests:
  - name: partner_principal.provision — super-admin cross-tenant without capability keys
    input:
      principals: [super_admin_cross_tenant]
      resources: [partner_bb]
      actions: [partner_principal.provision]
    expected:
      - principal: super_admin_cross_tenant
        resource: partner_bb
        actions:
          partner_principal.provision: EFFECT_ALLOW

  - name: partner_principal.provision — tenant-admin same tenant without capability keys
    input:
      principals: [tenant_admin_role_only]
      resources: [partner_aa]
      actions: [partner_principal.provision]
    expected:
      - principal: tenant_admin_role_only
        resource: partner_aa
        actions:
          partner_principal.provision: EFFECT_ALLOW

  - name: partner_principal.provision — tenant-admin denied cross-tenant
    input:
      principals: [tenant_admin_role_only]
      resources: [partner_bb]
      actions: [partner_principal.provision]
    expected:
      - principal: tenant_admin_role_only
        resource: partner_bb
        actions:
          partner_principal.provision: EFFECT_DENY

  - name: partner_principal.provision — allowed with activate capability
    input:
      principals: [activator_aa]
      resources: [partner_aa]
      actions: [partner_principal.provision]
    expected:
      - principal: activator_aa
        resource: partner_aa
        actions:
          partner_principal.provision: EFFECT_ALLOW

  - name: partner_principal.provision — denied without activate capability
    input:
      principals: [reader_only]
      resources: [partner_aa]
      actions: [partner_principal.provision]
    expected:
      - principal: reader_only
        resource: partner_aa
        actions:
          partner_principal.provision: EFFECT_DENY

  - name: partner_principal.provision — denied cross-tenant
    input:
      principals: [activator_aa]
      resources: [partner_bb]
      actions: [partner_principal.provision]
    expected:
      - principal: activator_aa
        resource: partner_bb
        actions:
          partner_principal.provision: EFFECT_DENY

  - name: partner_principal.deactivate — allowed with disable capability
    input:
      principals: [disabler_aa]
      resources: [partner_aa]
      actions: [partner_principal.deactivate]
    expected:
      - principal: disabler_aa
        resource: partner_aa
        actions:
          partner_principal.deactivate: EFFECT_ALLOW
