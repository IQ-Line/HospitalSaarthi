# yaml-language-server: $schema=https://api.cerbos.dev/latest/cerbos/policy/v1/TestSuite.schema.json
---
name: user_crud_permissions
description: >-
  User Management — resolver actions user.read, user.create, user.update, and user.deactivate
  each have explicit ALLOW (capability + tenant) and DENY (missing capability) pairs.

principals:
  full_crud:
    id: um-admin
    roles:
      - "_unresolved"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      org_id: null
      department: null
      capabilities:
        - "users:users:create"
        - "users:users:read"
        - "users:users:update"
        - "users:users:delete"
      delegated_capabilities: []
      clearances: {}
      um_clearance_effective_tier: 0

  read_only:
    id: um-viewer
    roles:
      - "_unresolved"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      org_id: null
      department: null
      capabilities:
        - "users:users:read"
      delegated_capabilities: []
      clearances: {}
      um_clearance_effective_tier: 0

  update_only:
    id: um-editor
    roles:
      - "_unresolved"
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      org_id: null
      department: null
      capabilities:
        - "users:users:update"
      delegated_capabilities: []
      clearances: {}
      um_clearance_effective_tier: 0

resources:
  user_list:
    id: list
    kind: user
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      department: null
      required_clearance: 0

  user_new:
    id: new
    kind: user
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      department: null
      required_clearance: 0

  user_record:
    id: user-42
    kind: user
    attr:
      iq_tenant_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      department: null
      required_clearance: 0

tests:
  - name: user.read(list) — full capability ALLOW
    input:
      principals: [full_crud]
      resources: [user_list]
      actions: [user.read]
    expected:
      - principal: full_crud
        resource: user_list
        actions:
          user.read: EFFECT_ALLOW

  - name: user.read(list) — missing users:users:read DENY
    input:
      principals: [update_only]
      resources: [user_list]
      actions: [user.read]
    expected:
      - principal: update_only
        resource: user_list
        actions:
          user.read: EFFECT_DENY

  - name: user.create — full capability ALLOW
    input:
      principals: [full_crud]
      resources: [user_new]
      actions: [user.create]
    expected:
      - principal: full_crud
        resource: user_new
        actions:
          user.create: EFFECT_ALLOW

  - name: user.create — missing users:users:create DENY
    input:
      principals: [read_only]
      resources: [user_new]
      actions: [user.create]
    expected:
      - principal: read_only
        resource: user_new
        actions:
          user.create: EFFECT_DENY

  - name: user.read — reader ALLOW
    input:
      principals: [read_only]
      resources: [user_record]
      actions: [user.read]
    expected:
      - principal: read_only
        resource: user_record
        actions:
          user.read: EFFECT_ALLOW

  - name: user.read — missing users:users:read DENY
    input:
      principals: [update_only]
      resources: [user_record]
      actions: [user.read]
    expected:
      - principal: update_only
        resource: user_record
        actions:
          user.read: EFFECT_DENY

  - name: user.update — editor ALLOW
    input:
      principals: [update_only]
      resources: [user_record]
      actions: [user.update]
    expected:
      - principal: update_only
        resource: user_record
        actions:
          user.update: EFFECT_ALLOW

  - name: user.update — missing users:users:update DENY
    input:
      principals: [read_only]
      resources: [user_record]
      actions: [user.update]
    expected:
      - principal: read_only
        resource: user_record
        actions:
          user.update: EFFECT_DENY

  - name: user.deactivate — admin ALLOW
    input:
      principals: [full_crud]
      resources: [user_record]
      actions: [user.deactivate]
    expected:
      - principal: full_crud
        resource: user_record
        actions:
          user.deactivate: EFFECT_ALLOW

  - name: user.deactivate — missing users:users:delete DENY
    input:
      principals: [read_only]
      resources: [user_record]
      actions: [user.deactivate]
    expected:
      - principal: read_only
        resource: user_record
        actions:
          user.deactivate: EFFECT_DENY

  - name: user.deactivate — editor without users:users:delete DENY
    input:
      principals: [update_only]
      resources: [user_record]
      actions: [user.deactivate]
    expected:
      - principal: update_only
        resource: user_record
        actions:
          user.deactivate: EFFECT_DENY
