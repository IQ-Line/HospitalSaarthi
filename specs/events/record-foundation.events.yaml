# Record Foundation domain events
#
# Envelope: each published message MUST be a complete DomainEvent satisfying:
#   specs/events/_envelope.schema.json
# Required top-level fields: event_id, event_type, source_module, iq_tenant_id,
# occurred_at, correlation_id, actor_id, event_contract_version, payload.
#
# This file defines event_type values and payload shapes.
# source_module for these events MUST be "record-foundation".
# Event publishing deferred until PostgreSQL outbox pattern ships (Phase 1).

specVersion: "1.0"
module: record-foundation
envelope: ./_envelope.schema.json

event_types:
  record-foundation.care-context.registered:
    semantic: care-context.registered
    description: A new care context has been registered.
    event_contract_version: "1.0.0"
    payload:
      type: object
      required: [care_context_id, patient_id, source_origin, source_record_type, display, period_start]
      additionalProperties: false
      properties:
        care_context_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        source_origin:
          type: string
          enum: [platform_module, legacy_system, external_abdm]
        source_record_type:
          type: string
        display:
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          type: ["string", "null"]
          format: date-time
        iq_tenant_id:
          type: string
          format: uuid

  record-foundation.bundle.stored:
    semantic: bundle.stored
    description: A FHIR Document Bundle has been stored immutably.
    event_contract_version: "1.0.0"
    payload:
      type: object
      required: [bundle_id, care_context_id, bundle_kind, fhir_profile_url]
      additionalProperties: false
      properties:
        bundle_id:
          type: string
          format: uuid
        care_context_id:
          type: string
          format: uuid
        bundle_kind:
          type: string
        fhir_profile_url:
          type: string
          format: uri
        iq_tenant_id:
          type: string
          format: uuid
