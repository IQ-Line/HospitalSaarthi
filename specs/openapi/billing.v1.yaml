        effective_from: { type: string, format: date-time, nullable: true }
        effective_to: { type: string, format: date-time, nullable: true }
    PriceAgreementCreate:
      type: object
      required: [agreement_code, agreement_type, agreed_price, valid_from]
      additionalProperties: false
      properties:
        agreement_code: { type: string, maxLength: 64 }
        agreement_type:
          type: string
          enum: [TENANT_DEFAULT, DOCTOR_OVERRIDE, DEPARTMENT_OVERRIDE]
        entity_id: { type: string, format: uuid, nullable: true }
        entity_name: { type: string, nullable: true }
        service_id: { type: string, format: uuid, nullable: true }
        package_id: { type: string, format: uuid, nullable: true }
        original_price: { allOf: [{ $ref: "#/components/schemas/Money" }], nullable: true }
        agreed_price: { $ref: "#/components/schemas/Money" }
