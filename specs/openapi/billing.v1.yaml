        transaction_id: { type: string, nullable: true }
        reference_number: { type: string, nullable: true }
        authorization_code: { type: string, nullable: true }
        card_type: { type: string, nullable: true }
        card_last4: { type: string, nullable: true, minLength: 4, maxLength: 4 }
        card_holder_name: { type: string, nullable: true }
        bank_name: { type: string, nullable: true }
