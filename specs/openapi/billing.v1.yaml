        cpt_code: { type: string, nullable: true }
        hcpcs_code: { type: string, nullable: true }
        duration_minutes: { type: integer, nullable: true }
        requires_doctor_approval: { type: boolean, default: false }
        is_emergency_service: { type: boolean, default: false }
