openapi: 3.1.0
info:
  title: HIMS Inventory API
  version: 1.0.0
  description: >-
    Operational inventory — stores, stock, GRN, indents. Base path `/api/inventory/v1`.
    Tenant scope via `iq_tenant_id` / `x-tenant-id` headers (enforced by inventory-svc).
servers:
  - url: /api/inventory/v1
paths:
  /stores:
    get:
      operationId: listStores
      summary: List stores
      tags: [Stores]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated store rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createStore
      summary: Create store
      description: Store code is assigned server-side from the store type code and per-type sequence.
      tags: [Stores]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreate'
      responses:
        '201':
          description: Store created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /stores/{storeId}:
    get:
      operationId: getStore
      summary: Get store by id
      tags: [Stores]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/storeId'
      responses:
        '200':
          description: Store found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateStore
      summary: Update store
      tags: [Stores]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/storeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdate'
      responses:
        '200':
          description: Store updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSingleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /indents:
    get:
      operationId: listIndents
      summary: List indents
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: from_store_id
          in: query
          schema:
            type: string
            format: uuid
        - name: to_store_id
          in: query
          schema:
            type: string
            format: uuid
        - name: include_lines
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Paginated indent list.
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createIndent
      summary: Create indent draft
      tags: [Indents]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Indent created.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /indents/by-number/{indentNumber}:
    get:
      operationId: getIndentByNumber
      summary: Get procurement indent by indent number (for GRN autofill)
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Indent detail.
        '404':
          $ref: '#/components/responses/NotFound'
  /indents/{indentId}:
    get:
      operationId: getIndent
      summary: Get indent with lines
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Indent detail.
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateIndentDraft
      summary: Update indent draft
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Indent updated.
  /indents/{indentId}/submit:
    post:
      operationId: submitIndent
      summary: Submit indent for approval
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Indent submitted.
  /indents/{indentId}/approve:
    post:
      operationId: approveIndent
      summary: Approve indent lines
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Indent approved.
  /indents/{indentId}/reject:
    post:
      operationId: rejectIndent
      summary: Reject indent
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Indent rejected.
  /indents/{indentId}/fulfill:
    post:
      operationId: fulfillIndent
      summary: Initiate indent fulfillment
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fulfillment initiated.
  /indents/{indentId}/cancel:
    post:
      operationId: cancelIndent
      summary: Cancel draft indent
      tags: [Indents]
      security:
        - bearerAuth: []
      parameters:
        - name: indentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Draft indent cancelled.
  /transfers:
    get:
      operationId: listStockTransfers
      summary: List stock transfers
      tags: [Transfers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated transfer list.
    post:
      operationId: createStockTransfer
      summary: Create stock transfer (links indent when provided)
      tags: [Transfers]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Transfer created.
  /transfers/{transferId}:
    get:
      operationId: getStockTransfer
      summary: Get stock transfer with lines
      tags: [Transfers]
      security:
        - bearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer detail.
  /transfers/{transferId}/dispatch:
    post:
      operationId: dispatchStockTransfer
      summary: Dispatch stock transfer (deducts source store only)
      tags: [Transfers]
      security:
        - bearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer dispatched (in transit).
  /transfers/{transferId}/receive:
    post:
      operationId: receiveStockTransfer
      summary: Receive stock transfer at destination store
      tags: [Transfers]
      security:
        - bearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transfer received.
  /transfers/{transferId}/cancel:
    post:
      operationId: cancelStockTransfer
      summary: Cancel transfer and return unsettled stock to source store
      tags: [Transfers]
      security:
        - bearerAuth: []
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 250
                  nullable: true
      responses:
        '200':
          description: Transfer cancelled.
  /internal/dispense-stock-issue:
    post:
      operationId: issueDispenseStock
      summary: Deduct stock for pharmacy dispense (FEFO)
      description: >
        Service-to-service endpoint used by pharmacy-svc when issuing medicines.
        Deducts quantity from the given store using FEFO lot ordering.
      tags: [Internal]
      security:
        - internalServiceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDispenseStockRequest"
      responses:
        "200":
          description: Stock deducted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDispenseStockResponse"
        "409":
          description: Insufficient stock or store not eligible to dispense
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceKey:
      type: apiKey
      in: header
      name: x-inventory-internal-key
      description: Must match INVENTORY_INTERNAL_API_KEY on inventory-svc (internal routes only).
  parameters:
    storeId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authorization denied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Constraint violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
    IssueDispenseStockRequest:
      type: object
      required: [store_id, lines]
      properties:
        store_id:
          type: string
          format: uuid
        issue_date:
          type: string
          format: date
          description: Optional YYYY-MM-DD used to skip expired lots
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [item_id, quantity]
            properties:
              item_id:
                type: string
                format: uuid
              quantity:
                type: number
                exclusiveMinimum: 0
    IssueDispenseStockResponse:
      type: object
      required: [store_id, deductions]
      properties:
        store_id:
          type: string
          format: uuid
        deductions:
          type: array
          items:
            type: object
            required: [item_id, quantity, lots]
            properties:
              item_id:
                type: string
                format: uuid
              quantity:
                type: number
              lots:
                type: array
                items:
                  type: object
                  required: [stock_id, qty]
                  properties:
                    stock_id:
                      type: string
                      format: uuid
                    lot_id:
                      type: string
                      format: uuid
                      nullable: true
                    qty:
                      type: number
    Store:
      type: object
      required:
        - id
        - store_code
        - store_name
        - store_type_id
        - facility_id
        - department_id
        - physical_location
        - can_receive_stock
        - can_dispense
        - can_issue_to_ward
        - track_batch_expiry
        - indent_authority
        - is_central_store
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        store_code:
          type: string
        store_name:
          type: string
        store_type_id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
          nullable: true
        physical_location:
          type: string
        can_receive_stock:
          type: boolean
        can_dispense:
          type: boolean
        can_issue_to_ward:
          type: boolean
        track_batch_expiry:
          type: boolean
        indent_authority:
          type: boolean
        indent_target_store_id:
          type: string
          format: uuid
          nullable: true
        is_central_store:
          type: boolean
          description: >
            Mark as the tenant central (procurement) store. Only one per tenant.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StoreCreate:
      type: object
      additionalProperties: false
      required:
        - store_name
        - store_type_id
        - facility_id
        - department_id
      properties:
        store_name:
          type: string
          minLength: 1
          maxLength: 200
        store_type_id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        physical_location:
          type: string
          maxLength: 500
          default: ''
        can_receive_stock:
          type: boolean
        can_dispense:
          type: boolean
        can_issue_to_ward:
          type: boolean
        track_batch_expiry:
          type: boolean
        indent_authority:
          type: boolean
        indent_target_store_id:
          type: string
          format: uuid
          nullable: true
        is_central_store:
          type: boolean
          description: >
            Mark as the tenant central (procurement) store. Only one per tenant.
        is_active:
          type: boolean
          default: true
    StoreUpdate:
      type: object
      additionalProperties: false
      properties:
        store_name:
          type: string
          minLength: 1
          maxLength: 200
        store_type_id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        physical_location:
          type: string
          maxLength: 500
        can_receive_stock:
          type: boolean
        can_dispense:
          type: boolean
        can_issue_to_ward:
          type: boolean
        track_batch_expiry:
          type: boolean
        indent_authority:
          type: boolean
        indent_target_store_id:
          type: string
          format: uuid
          nullable: true
        is_central_store:
          type: boolean
          description: >
            Mark as the tenant central (procurement) store. Only one per tenant.
        is_active:
          type: boolean
    StoreListResponse:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Store'
        total:
          type: integer
    StoreSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Store'
