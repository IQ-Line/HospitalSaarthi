openapi: 3.1.0
info:
  title: Integration Hub API (ABDM)
  version: 1.1.0
  description: |
    Hospital platform adapter for NHA ABDM gateway access — Milestones M1 (ABHA),
    M2 (HIP-side care-context linking + consent receipt), and M3 (HIU consent
    request + data fetch, HIP data response).

    Authenticated routes require header `x-tenant-id` (hospital tenant UUID) on each operation below.

    Gateway callback paths (e.g. `/api/v3/hiu/consent/request/on-init`) are not
    documented here; see `docs/architecture/lld/integration-hub/08-m3-flows.md` for
    inbound body shapes.

servers:
  - url: http://localhost:3007/api/abdm/v1
    description: Development

tags:
  - name: M0-Gateway
    description: Gateway session and encryption certificate
  - name: M1-Enrolment
    description: ABHA creation via Aadhaar
  - name: M1-Profile
    description: Profile and ABHA card download
  - name: M1-Login
    description: Login to existing ABHA
  - name: M1-Verify
    description: Frontdesk verification of existing ABHA
  - name: M3-HIU-Consent
    description: HIU-side consent request, notify, fetch (doctor requesting records from another HIP)
  - name: M3-HIU-Data
    description: HIU-side data fetch (requesting and receiving encrypted bundles)

security:
  - TenantHeader: []

paths:
  /m0/gateway/session:
    get:
      operationId: abdmM0GatewaySessionProbe
      summary: Verify gateway access token and ABHA public certificate
      description: |
        Confirms NHA gateway client-credentials and ABHA encryption certificate
        are reachable. Does not create an enrolment session.
      tags: [M0-Gateway]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      security:
        - TenantHeader: []
      responses:
        "200":
          description: Upstream reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewaySessionProbeOk"
        "400":
          description: Missing tenant id header
        "502":
          description: NHA gateway or ABHA API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewaySessionProbeFail"

  /m0/bridge-services:
    get:
      operationId: abdmM0FindBridgeServices
      summary: Find services registered on the NHA bridge
      description: |
        Proxies NHA gateway §3.2.7 `GET /api/hiecm/gateway/v3/bridge-services`.
        Returns bridge metadata and all service IDs linked to the bridge credentials.

        `x-tenant-id` is optional. When omitted, deployment env credentials
        (`ABDM_SANDBOX_CLIENT_ID` / `ABDM_SANDBOX_CLIENT_SECRET`) are used.
        When provided, the active tenant integration profile credentials are used.
      tags: [M0-Gateway]
      parameters:
        - $ref: "#/components/parameters/XTenantIdOptional"
      security: []
      responses:
        "200":
          description: NHA bridge-services response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhaBridgeServicesResponse"
        "404":
          description: No active integration profile for tenant (when x-tenant-id provided)
        "502":
          description: NHA gateway error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDiscoveryFail"

  /tenant/mapped-facility-ids:
    get:
      operationId: abdmM0MappedFacilityIds
      summary: Mapped facility IDs live on NHA bridge ("ABDM Live")
      description: |
        Returns HIP facility IDs that are both configured in Configurator
        (`tenant_integration_profiles`) and registered as eligible services on the NHA bridge.

        `x-tenant-id` is optional (controls which gateway credentials are used for the NHA call).
      tags: [M0-Gateway]
      parameters:
        - $ref: "#/components/parameters/XTenantIdOptional"
      security: []
      responses:
        "200":
          description: Facility IDs mapped and live on bridge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MappedFacilityIdsResponse"
        "404":
          description: No active integration profile for tenant (when x-tenant-id provided)
        "502":
          description: NHA gateway error
        "503":
          description: Configurator profile listing unavailable

  /m1/enrol/aadhaar/otp:
    post:
      operationId: abdmM1EnrolAadhaarOtp
      summary: Send Aadhaar OTP for ABHA enrolment
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      security:
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolAadhaarOtpRequest"
      responses:
        "200":
          description: OTP dispatched; platform session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolAadhaarOtpResponse"
        "400":
          description: Invalid body (e.g. not 12-digit Aadhaar)
        "401":
          description: Missing or invalid auth (when ENABLE_AUTH=true)
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/enrol/aadhaar/otp/resend:
    post:
      operationId: abdmM1EnrolAadhaarOtpResend
      summary: Resend Aadhaar OTP (same NHA contract with populated txnId)
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      security:
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolAadhaarOtpResendRequest"
      responses:
        "200":
          description: OTP resent; session txnId updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolAadhaarOtpResponse"
        "400":
          description: Invalid body or Aadhaar mismatch
        "404":
          description: Session not found
        "409":
          description: Session not in OTP_REQUESTED
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/enrol/aadhaar/verify:
    post:
      operationId: abdmM1EnrolAadhaarVerify
      summary: Verify Aadhaar OTP and create ABHA (NHA byAadhaar)
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      security:
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolAadhaarVerifyRequest"
      responses:
        "200":
          description: ABHA created; session stores x_token + new txnId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolAadhaarVerifyResponse"
        "400":
          description: Invalid OTP or body
        "404":
          description: Session not found
        "409":
          description: Session not in OTP_REQUESTED
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/enrol/mobile-verify/otp:
    post:
      operationId: abdmM1EnrolMobileVerifyOtp
      summary: Send mobile OTP during Aadhaar enrolment chain
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      security:
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyOtpRequest"
      responses:
        "200":
          description: OTP sent to mobile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolMobileVerifyOtpResponse"
        "400":
          description: Invalid mobile
        "404":
          description: Session not found
        "409":
          description: Session not in ABHA_CREATED
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/enrol/mobile-verify/verify:
    post:
      operationId: abdmM1EnrolMobileVerifyConfirm
      summary: Verify mobile OTP (NHA auth/byAbdm)
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      security:
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyConfirmRequest"
      responses:
        "200":
          description: Mobile verified; txnId updated for next enrolment step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolMobileVerifyConfirmResponse"
        "400":
          description: Invalid OTP
        "404":
          description: Session not found
        "409":
          description: Session not in ABHA_CREATED
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/abha-address/suggestions:
    get:
      operationId: abdmM1AbhaAddressSuggestions
      summary: List suggested ABHA addresses for the enrolment txn
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      security:
        - TenantHeader: []
      responses:
        "200":
          description: Suggestions returned; session txnId may advance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaAddressSuggestionsResponse"
        "400":
          description: Missing or invalid sessionId
        "404":
          description: Session not found
        "409":
          description: Session not in ABHA_CREATED
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/abha-address:
    post:
      operationId: abdmM1AbhaAddressCreate
      summary: Create preferred ABHA address
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      security:
        - TenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAbhaAddressRequest"
      responses:
        "200":
          description: Address created; session transitions to ADDRESS_CREATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAbhaAddressResponse"
        "400":
          description: Invalid body
        "404":
          description: Session not found
        "409":
          description: Session not in ABHA_CREATED
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/profile:
    get:
      operationId: abdmM1ProfileAccount
      summary: Fetch ABHA profile (requires session x_token)
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      security:
        - TenantHeader: []
      responses:
        "200":
          description: Profile JSON from NHA (passthrough subset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAccountResponse"
        "400":
          description: Missing or invalid sessionId
        "404":
          description: Session not found
        "409":
          description: Session state not ready for profile read
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/profile/abha-card:
    get:
      operationId: abdmM1ProfileAbhaCard
      summary: Download ABHA card payload (requires session x_token)
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      security:
        - TenantHeader: []
      responses:
        "200":
          description: Card object from NHA (often base64 data)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAbhaCardResponse"
        "400":
          description: Missing or invalid sessionId
        "404":
          description: Session not found
        "409":
          description: Session state not ready for profile read
        "4XX":
          description: Mapped NHA client error
        "502":
          description: NHA unavailable or unexpected response

  /m1/sessions/{sessionId}:
    get:
      operationId: abdmM1SessionGet
      summary: Read platform session state and next-step hint
      tags: [M1-Enrolment]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session snapshot for UI routing
        "404":
          description: Session not found

  /m1/login/otp:
    post:
      operationId: abdmM1LoginAbhaNumberOtp
      summary: Login via ABHA number OTP
      tags: [M1-Login]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abhaNumber]
              properties:
                abhaNumber:
                  type: string
                channel:
                  type: string
                  enum: [aadhaar, abha-otp]
      responses:
        "200":
          description: OTP dispatched

  /m1/login/aadhaar/otp:
    post:
      operationId: abdmM1LoginAadhaarOtp
      summary: Login via Aadhaar OTP
      tags: [M1-Login]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolAadhaarOtpRequest"
      responses:
        "200":
          description: OTP dispatched

  /m1/login/mobile/otp:
    post:
      operationId: abdmM1LoginMobileOtp
      summary: Login via mobile OTP (creates a new platform session)
      tags: [M1-Login]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginMobileOtpRequest"
            example:
              mobile: "6789789078"
      responses:
        "200":
          description: OTP dispatched; response includes new sessionId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOtpDispatchResponse"

  /m1/login/verify:
    post:
      operationId: abdmM1LoginVerify
      summary: Login OTP verify
      tags: [M1-Login]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyConfirmRequest"
      responses:
        "200":
          description: Login verified; x_token stored on session (or accounts list when mobile multi-ABHA)

  /m1/login/verify/user:
    post:
      operationId: abdmM1LoginVerifyUser
      summary: Login — select ABHA account after mobile OTP (NHA verify/user)
      tags: [M1-Login]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginVerifyUserRequest"
      responses:
        "200":
          description: Profile x_token stored on session

  /m1/verify/abha-number/otp:
    post:
      operationId: abdmM1VerifyAbhaNumberOtp
      summary: Frontdesk verify ABHA number — send OTP
      tags: [M1-Verify]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abhaNumber]
              properties:
                abhaNumber:
                  type: string
                channel:
                  type: string
                  enum: [aadhaar, abha-otp]
      responses:
        "200":
          description: OTP dispatched

  /m1/verify/abha-number/verify:
    post:
      operationId: abdmM1VerifyAbhaNumberConfirm
      summary: Frontdesk verify ABHA number — confirm OTP
      tags: [M1-Verify]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyConfirmRequest"
      responses:
        "200":
          description: ABHA verified

  /m1/verify/abha-address/otp:
    post:
      operationId: abdmM1VerifyAbhaAddressOtp
      summary: Frontdesk verify ABHA address — send OTP
      tags: [M1-Verify]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [abhaAddress]
              properties:
                abhaAddress:
                  type: string
                channel:
                  type: string
                  enum: [mobile, aadhaar]
      responses:
        "200":
          description: OTP dispatched

  /m1/verify/abha-number/verify/user:
    post:
      operationId: abdmM1VerifyAbhaNumberVerifyUser
      summary: Frontdesk verify — select ABHA after mobile OTP (NHA verify/user)
      tags: [M1-Verify]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginVerifyUserRequest"
      responses:
        "200":
          description: Profile x_token stored on session

  /m1/verify/abha-address/verify:
    post:
      operationId: abdmM1VerifyAbhaAddressConfirm
      summary: Frontdesk verify ABHA address — confirm OTP
      tags: [M1-Verify]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyConfirmRequest"
      responses:
        "200":
          description: ABHA address verified

  /m1/verify/abha-address/verify/user:
    post:
      operationId: abdmM1VerifyAbhaAddressVerifyUser
      summary: Not used for ABHA address (PHR flow) — returns 409; use verify then GET profile
      description: |
        ABHA address login uses PHR `/v3/phr/web/login/abha/*` and returns profile tokens on verify.
        Do not call this after `/m1/verify/abha-address/verify`. For mobile + multiple ABHAs on ABHA number, use `/m1/verify/abha-number/verify/user`.
      tags: [M1-Verify]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginVerifyUserRequest"
      responses:
        "200":
          description: Profile x_token stored on session

  /m1/profile/mobile/update/otp:
    post:
      operationId: abdmM1ProfileMobileUpdateOtp
      summary: Profile mobile update — request OTP
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyOtpRequest"
      responses:
        "200":
          description: OTP sent

  /m1/profile/mobile/update/verify:
    post:
      operationId: abdmM1ProfileMobileUpdateVerify
      summary: Profile mobile update — verify OTP
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyConfirmRequest"
      responses:
        "200":
          description: Mobile updated

  /m1/profile/email/update/otp:
    post:
      operationId: abdmM1ProfileEmailUpdateOtp
      summary: Profile email update — request OTP
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, email]
              properties:
                sessionId:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP sent

  /m1/profile/email/update/verify:
    post:
      operationId: abdmM1ProfileEmailUpdateVerify
      summary: Profile email update — verify OTP
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolMobileVerifyConfirmRequest"
      responses:
        "200":
          description: Email updated

  /m1/profile/phr-card:
    get:
      operationId: abdmM1ProfilePhrCard
      summary: Download PHR card (requires session x_token)
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PHR card payload

  /m1/profile/qr-code:
    get:
      operationId: abdmM1ProfileQrCode
      summary: Download profile QR code (requires session x_token)
      tags: [M1-Profile]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: QR code payload

  /m2/link-token/acquire:
    post:
      operationId: abdmM2LinkTokenAcquire
      summary: Pre-mint HIP link token (cache only; does not link care contexts)
      tags: [M2-HIP-Linking]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkTokenAcquireRequest"
      responses:
        "202":
          description: Token acquired or acquisition started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTokenAcquireResponse"
        "503":
          description: Token not available within timeout

  /m2/link-token/status:
    get:
      operationId: abdmM2LinkTokenStatus
      summary: Poll link-token pre-mint session or cache by ABHA address
      tags: [M2-HIP-Linking]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: abhaAddress
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTokenStatusResponse"
        "404":
          description: Session not found and no cached token

  /m2/sessions/{sessionId}:
    get:
      operationId: abdmM2SessionGet
      summary: Poll ABDM flow session state
      tags: [M2-HIP-Linking]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session status
        "404":
          description: Session not found

  /m2/hip/initiated-link/start:
    post:
      operationId: abdmM2HipInitiatedLinkStart
      summary: Staff-triggered HIP-initiated care context linking
      tags: [M2-HIP-Linking]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HipInitiatedLinkStartRequest"
      responses:
        "202":
          description: Link request accepted; session in CC_LINK_REQUESTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HipInitiatedLinkStartResponse"
        "503":
          description: Link token acquisition failed

  /m2/orchestrate/after-care-contexts:
    post:
      operationId: abdmM2OrchestrateAfterCareContexts
      summary: HIP-initiated link plus add-contexts publish after consultation care contexts
      tags: [M2-HIP-Linking]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patientId, careContexts]
              properties:
                patientId:
                  type: string
                eventDate:
                  type: string
                  format: date-time
                careContexts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [referenceNumber, display, hiType]
                    properties:
                      referenceNumber:
                        type: string
                      display:
                        type: string
                      hiType:
                        type: string
      responses:
        "202":
          description: Orchestration accepted (best-effort per step)

  /m2/add-contexts/publish:
    post:
      operationId: abdmM2AddContextsPublish
      summary: Notify gateway of new care context for linked patient
      tags: [M2-HIP-Linking]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - abhaAddress
                - patientReference
                - careContextReference
                - hiType
              properties:
                abhaAddress:
                  type: string
                patientReference:
                  type: string
                careContextReference:
                  type: string
                hiType:
                  type: string
                eventDate:
                  type: string
                  format: date-time
      responses:
        "202":
          description: Context notify accepted

  /m2/sms/notify:
    post:
      operationId: abdmM2SmsNotify
      summary: HIP-initiated SMS deep link to patient
      tags: [M2-HIP-Linking]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNo]
              properties:
                phoneNo:
                  type: string
                hipName:
                  type: string
      responses:
        "202":
          description: SMS notify accepted

  /m3/hiu/consent/request:
    post:
      operationId: abdmM3HiuConsentRequestStart
      summary: Staff-triggered HIU consent request (doctor asks for records from another HIP)
      tags: [M3-HIU-Consent]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/M3HiuConsentRequestStartBody"
      responses:
        "202":
          description: Consent request accepted; session in CONSENT_INIT_REQUESTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3HiuConsentRequestStartResponse"
        "400":
          description: Invalid request body (e.g. dataEraseAt not in future)

  /m3/hiu/consent/requests:
    get:
      operationId: abdmM3HiuConsentRequestSearch
      summary: Search HIU consent requests for tenant (staff consent list)
      tags: [M3-HIU-Consent]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: name
          in: query
          schema: { type: string }
          description: Patient name or ABHA address (partial match)
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Filter created_at from (inclusive, start of day)
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Filter created_at to (inclusive, end of day)
        - name: drName
          in: query
          schema: { type: string }
          description: Requesting healthcare provider name (partial match)
        - name: hiTypes
          in: query
          schema: { type: string }
          description: Single HI type filter (PascalCase)
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, granted, denied, expired, revoked]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Paginated consent request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3HiuConsentRequestSearchResponse"

  /m3/hiu/consent/request/{sessionId}:
    get:
      operationId: abdmM3HiuConsentRequestGet
      summary: Poll HIU consent-request flow state
      tags: [M3-HIU-Consent]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3HiuConsentRequestState"
        "404":
          description: Session not found

  /m3/hiu/consent/request/{sessionId}/records:
    get:
      operationId: abdmM3HiuConsentArtefactRecordsGet
      summary: Lazy-load health record bundles for a granted consent session
      description: |
        Resolves decrypted HIP push bundles or local Record Foundation fallback.
        Not called from the list endpoint — fetch when opening View Documents.
      tags: [M3-HIU-Consent]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: consentId
          in: query
          required: false
          schema:
            type: string
          description: Optional consent artefact id — omit to load all facilities for the session
      responses:
        "200":
          description: Health record bundles per consent artefact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3HiuConsentArtefactRecordsResponse"
        "404":
          description: Session not found, consent not accessible, or artefact not found

  /m3/hiu/data-request:
    post:
      operationId: abdmM3HiuDataRequestStart
      summary: Staff-triggered HIU data request (fetch records on a granted consent)
      tags: [M3-HIU-Data]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/M3HiuDataRequestStartBody"
      responses:
        "202":
          description: Data request accepted; transfer in DATA_REQUESTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3HiuDataRequestStartResponse"
        "400":
          description: Invalid consentId or consent not in GRANTED state
        "404":
          description: Consent artefact not found for this tenant

  /m3/hiu/transfers/{transferId}:
    get:
      operationId: abdmM3HiuTransferGet
      summary: Poll HIU data-fetch transfer state and read decrypted bundle once stored
      tags: [M3-HIU-Data]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transfer state (and bundle if state = COMPLETED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3HiuTransferState"
        "404":
          description: Transfer not found

  /m3/hiu/attachment/{sessionId}/{bundleId}/{num}:
    get:
      operationId: abdmM3HiuAttachmentGet
      summary: Download a decrypted attachment from a granted consent health record bundle
      description: |
        Returns base64 attachment bytes from a FHIR bundle entry linked to an active GRANTED consent.
        Access is denied (404) when consent is not granted, revoked, denied, or past dataEraseAt.
      tags: [M3-HIU-Data]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bundleId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: FHIR bundle id or care-context reference for the health record
        - name: num
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: 1-based attachment index within the bundle DocumentReference
      responses:
        "200":
          description: Attachment payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M3HiuAttachmentResponse"
        "404":
          description: Consent not accessible, attachment not found, or bundle entry missing

components:
  parameters:
    XTenantId:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Hospital tenant UUID (required on every request).
      example: "00000000-0000-4000-8000-0000000000aa"

    XTenantIdOptional:
      name: x-tenant-id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Optional hospital tenant UUID. When set, tenant integration profile credentials
        are used for the NHA gateway call; otherwise deployment env credentials apply.

  securitySchemes:
    TenantHeader:
      type: apiKey
      in: header
      name: x-tenant-id
      description: Hospital tenant UUID (`iq_tenant_id` is accepted as an alias).

  schemas:
    EnrolAadhaarOtpRequest:
      type: object
      required: [aadhaarNumber]
      properties:
        aadhaarNumber:
          type: string
          pattern: "^\\d{12}$"
          description: Twelve-digit Aadhaar (sandbox test value in SBX).

    EnrolAadhaarOtpResponse:
      type: object
      required: [sessionId, txnId, message]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        message:
          type: string

    EnrolAadhaarOtpResendRequest:
      type: object
      required: [sessionId, aadhaarNumber]
      properties:
        sessionId:
          type: string
          format: uuid
        aadhaarNumber:
          type: string
          pattern: "^\\d{12}$"

    EnrolAadhaarVerifyRequest:
      type: object
      required: [sessionId, otp, mobile]
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
        otp:
          type: string
          pattern: "^\\d{6}$"
        mobile:
          type: string
          pattern: "^\\d{10}$"
          description: Primary 10-digit mobile for ABHA (where Aadhaar OTP was received, or chosen primary number).
        useAadhaarLinkedMobile:
          type: boolean
          description: >
            When true, skip enrol mobile-verify after byAadhaar (user chose Aadhaar-linked primary mobile).
            When false, require mobile-verify OTP before ABHA address. When omitted, inferred from NHA ABHAProfile.mobile.
      example:
        sessionId: "402851e2-9949-4371-9902-1e2954c3c412"
        otp: "123456"
        mobile: "6789789089"
        useAadhaarLinkedMobile: true

    EnrolAadhaarVerifyResponse:
      type: object
      required: [sessionId, txnId, message]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        healthIdNumber:
          type: string
        isNew:
          type: boolean
        mobileVerifySkipped:
          type: boolean
          description: True when mobile-verify OTP was bypassed (Aadhaar-linked primary mobile).
        message:
          type: string

    LoginMobileOtpRequest:
      type: object
      required: [mobile]
      additionalProperties: false
      properties:
        mobile:
          type: string
          pattern: "^\\d{10}$"

    LoginOtpDispatchResponse:
      type: object
      required: [sessionId, txnId, message]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        message:
          type: string

    EnrolMobileVerifyOtpRequest:
      type: object
      required: [sessionId, mobile]
      additionalProperties: false
      properties:
        sessionId:
          type: string
          format: uuid
        mobile:
          type: string
          pattern: "^\\d{10}$"

    EnrolMobileVerifyOtpResponse:
      type: object
      required: [sessionId, txnId, message]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        message:
          type: string

    EnrolMobileVerifyConfirmRequest:
      type: object
      required: [sessionId, otp]
      properties:
        sessionId:
          type: string
          format: uuid
        otp:
          type: string
          pattern: "^\\d{6}$"

    EnrolMobileVerifyConfirmResponse:
      type: object
      required: [sessionId, txnId, message]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        message:
          type: string

    LoginVerifyUserRequest:
      type: object
      required: [sessionId, abhaNumber]
      properties:
        sessionId:
          type: string
          format: uuid
        abhaNumber:
          type: string
          description: 14-digit ABHA number (hyphens optional)

    LoginVerifyUserResponse:
      type: object
      required: [sessionId, txnId, message]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        message:
          type: string

    AbhaAddressSuggestionsResponse:
      type: object
      required: [sessionId, txnId, suggestions]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        suggestions:
          type: array
          items:
            type: string

    CreateAbhaAddressRequest:
      type: object
      required: [sessionId, abhaAddress]
      properties:
        sessionId:
          type: string
          format: uuid
        abhaAddress:
          type: string
        preferred:
          type: integer
          enum: [1]
          default: 1
          description: NHA accepts only `1` for this enrolment step (omit to default to 1).

    CreateAbhaAddressResponse:
      type: object
      required: [sessionId, txnId]
      properties:
        sessionId:
          type: string
          format: uuid
        txnId:
          type: string
        healthIdNumber:
          type: string
        preferredAbhaAddress:
          type: string

    ProfileAccountResponse:
      type: object
      required: [sessionId, profile]
      properties:
        sessionId:
          type: string
          format: uuid
        profile:
          type: object
          additionalProperties: true

    ProfileAbhaCardResponse:
      type: object
      required: [sessionId, card]
      properties:
        sessionId:
          type: string
          format: uuid
        card:
          type: object
          additionalProperties: true

    GatewaySessionProbeOk:
      type: object
      required: [ok, gateway, certificate]
      properties:
        ok:
          type: boolean
          const: true
        gateway:
          type: object
          properties:
            tokenValidUntilApprox:
              type: string
              format: date-time
              nullable: true
        certificate:
          type: object
          properties:
            encryptionAlgorithm:
              type: string
            publicKeyFingerprint:
              type: string
            cacheValidUntilApprox:
              type: string
              format: date-time
              nullable: true

    GatewaySessionProbeFail:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          properties:
            message:
              type: string
            statusCode:
              type: integer
            code:
              type: string
              nullable: true

    GatewayDiscoveryFail:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: object
          properties:
            message:
              type: string
            statusCode:
              type: integer
            code:
              type: string
              nullable: true

    NhaBridgeInfo:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        active:
          type: boolean
        blocklisted:
          type: boolean

    NhaBridgeService:
      type: object
      required: [id, types]
      properties:
        id:
          type: string
        name:
          type: string
        types:
          type: array
          items:
            type: string
        endpoints:
          type: object
          additionalProperties: true

    NhaBridgeServicesResponse:
      type: object
      required: [bridge, services]
      properties:
        bridge:
          $ref: "#/components/schemas/NhaBridgeInfo"
        services:
          type: array
          items:
            $ref: "#/components/schemas/NhaBridgeService"

    MappedFacilityIdsResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            type: string
          description: HIP facility IDs configured and live on the NHA bridge

    LinkTokenAcquireRequest:
      type: object
      required: [abhaAddress, demographics]
      properties:
        abhaAddress:
          type: string
        abhaNumber:
          type: string
        timeoutMs:
          type: integer
        wait:
          type: boolean
          description: When true, blocks until token is in cache (tests only). Default is async 202 TOKEN_REQUESTED.
        demographics:
          type: object
          required: [name, gender, yearOfBirth]
          properties:
            name:
              type: string
            gender:
              type: string
              enum: [M, F, O, D]
            yearOfBirth:
              type: integer

    LinkTokenAcquireResponse:
      type: object
      required: [sessionId, state, abhaAddress]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [TOKEN_REQUESTED, TOKEN_AVAILABLE, FAILED]
        abhaAddress:
          type: string
        tokenReady:
          type: boolean
        message:
          type: string

    LinkTokenStatusResponse:
      type: object
      required: [abhaAddress, state, tokenReady]
      properties:
        sessionId:
          type: string
          format: uuid
        abhaAddress:
          type: string
        state:
          type: string
          enum: [TOKEN_REQUESTED, TOKEN_AVAILABLE, FAILED, NOT_FOUND]
        tokenReady:
          type: boolean
        tokenExpiresAt:
          type: string
          format: date-time
        message:
          type: string

    HipInitiatedLinkStartRequest:
      type: object
      required: [abhaAddress, patientName, gender, yearOfBirth, careContexts]
      properties:
        abhaAddress:
          type: string
        abhaNumber:
          type: string
        patientName:
          type: string
        gender:
          type: string
          enum: [M, F, O, D]
        yearOfBirth:
          type: integer
        careContexts:
          type: array
          items:
            type: object
            required: [referenceNumber, display, hiType]
            properties:
              referenceNumber:
                type: string
              display:
                type: string
              hiType:
                type: string

    HipInitiatedLinkStartResponse:
      type: object
      required: [sessionId, state]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string

    M3HiuConsentRequestStartBody:
      type: object
      required: [patientAbhaAddress, purpose, hiTypes, dateRange]
      properties:
        patientAbhaAddress:
          type: string
          description: ABHA address of the patient whose records we want
          example: "test.user@sbx"
        patientId:
          type: string
          description: Optional HIMS patient UUID — used to locate local FHIR bundles when HIP push is pending
        patientName:
          type: string
          description: Optional display name stored for consent list UI
        patientAbhaNumber:
          type: string
          description: Optional ABHA number stored for consent list UI
        hipId:
          type: string
          description: Optional — pin request to a specific HIP. Omit for any HIP holding the records.
        purpose:
          type: string
          enum: [CAREMGT, BTG, PUBHLTH, HPAYMT, DSRCH, PATRQT]
        requesterName:
          type: string
          description: Requesting clinician name (shown as healthcare provider in consent list)
        hiTypes:
          type: array
          items:
            type: string
            enum: [OPConsultation, Prescription, DiagnosticReport, DischargeSummary, ImmunizationRecord, HealthDocumentRecord, WellnessRecord]
        dateRange:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to:   { type: string, format: date-time }
        dataEraseAt:
          type: string
          format: date-time
          description: Optional — when CM should erase the artefact. Defaults to dateRange.to + 90 days.

    M3HiuConsentRequestStartResponse:
      type: object
      required: [sessionId, state]
      properties:
        sessionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [CONSENT_INIT_REQUESTED]

    M3HiuConsentRequestSearchResponse:
      type: object
      required: [sessions, page, limit, totalCount]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/M3HiuConsentListSession"
        page:
          type: integer
        limit:
          type: integer
        totalCount:
          type: integer

    M3HiuConsentListSession:
      type: object
      required: [sessionId, consentRequestId, status, identifiers, hiTypes, fromDate, toDate, dataEraseAt, createdAt, updatedAt]
      properties:
        sessionId:
          type: string
          format: uuid
        consentRequestId:
          type: string
        status:
          type: string
          enum: [REQUESTED, GRANTED, DENIED, EXPIRED, REVOKED]
        drName:
          type: string
        identifiers:
          type: object
          properties:
            name: { type: string }
            abha_address: { type: string }
            abha_number: { type: string }
        fromDate:
          type: string
          format: date-time
        toDate:
          type: string
          format: date-time
        dataEraseAt:
          type: string
          format: date-time
        hiTypes:
          type: array
          items: { type: string }
        purpose:
          type: object
          properties:
            code: { type: string }
            text: { type: string }
        consentArtifacts:
          type: array
          items:
            $ref: "#/components/schemas/M3HiuConsentListArtifact"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    M3HiuConsentListArtifact:
      type: object
      properties:
        consentId: { type: string }
        hipId: { type: string }
        hipName: { type: string }
        status: { type: string }
        hiTypes:
          type: array
          items: { type: string }
        careContexts:
          type: array
          items:
            type: object
            properties:
              patientReference: { type: string }
              careContextReference: { type: string }
        transferId:
          type: string
          format: uuid
          description: Latest data transfer for this artefact, when present
        dataPushed:
          $ref: "#/components/schemas/M3HiuConsentListDataPushed"
          description: Decrypted health records from HIP push (legacy searchConsents parity)

    M3HiuConsentListDataPushed:
      type: object
      properties:
        transactionId:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/M3HiuConsentListDataPushedEntry"

    M3HiuConsentListDataPushedEntry:
      type: object
      properties:
        id:
          type: string
        careContextReference:
          type: string
        content:
          type: string
          description: Decrypted FHIR bundle JSON string

    M3HiuConsentArtefactRecordsResponse:
      type: object
      required: [sessionId, artefacts]
      properties:
        sessionId:
          type: string
          format: uuid
        artefacts:
          type: array
          items:
            $ref: "#/components/schemas/M3HiuConsentArtefactRecordItem"

    M3HiuConsentArtefactRecordItem:
      type: object
      required: [consentId, hipId]
      properties:
        consentId:
          type: string
        hipId:
          type: string
        hipName:
          type: string
        dataPushed:
          $ref: "#/components/schemas/M3HiuConsentListDataPushed"

    M3HiuConsentRequestState:
      type: object
      required: [sessionId, state]
      properties:
        sessionId:
          type: string
          format: uuid
        consentRequestId:
          type: string
          description: CM-issued ID; populated after the on-init callback flips state to AWAITING_PATIENT_APPROVAL
        state:
          type: string
          description: Member of M3_HIU_STATES (consent-request sub-flow subset)
          enum: [CONSENT_INIT_REQUESTED, AWAITING_PATIENT_APPROVAL, CONSENT_GRANTED, CONSENT_DENIED, EXPIRED]
        consentArtefactIds:
          type: array
          items: { type: string }
          description: Populated when state becomes CONSENT_GRANTED; one per HIP holding records
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    M3HiuDataRequestStartBody:
      type: object
      required: [consentId]
      properties:
        consentId:
          type: string
          description: Consent artefact ID from a granted consent request (state must be CONSENT_GRANTED)

    M3HiuDataRequestStartResponse:
      type: object
      required: [transferId, state]
      properties:
        transferId:
          type: string
          format: uuid
        state:
          type: string
          enum: [DATA_REQUESTED]

    M3HiuTransferState:
      type: object
      required: [transferId, state]
      properties:
        transferId:
          type: string
          format: uuid
        state:
          type: string
          description: Member of M3_HIU_STATES (data-fetch sub-flow subset). EXPIRED is the catch-all non-success terminal (decryption fail / push timeout / etc.)
          enum: [DATA_REQUESTED, AWAITING_PUSH, BUNDLES_RECEIVED, BUNDLES_DECRYPTED, RECORDS_INGESTED, ACKNOWLEDGED, EXPIRED]
        consentId:
          type: string
        bundle:
          type: object
          description: Decrypted FHIR bundle; present only when state = ACKNOWLEDGED
          additionalProperties: true
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    M3HiuAttachmentResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [attachment]
          properties:
            attachment:
              type: object
              required: [title, contentType, content]
              properties:
                title:
                  type: string
                contentType:
                  type: string
                  description: MIME type from the FHIR DocumentReference (typically application/pdf)
                content:
                  type: string
                  format: byte
                  description: Base64-encoded attachment bytes
