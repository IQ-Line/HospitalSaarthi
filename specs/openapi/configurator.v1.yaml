openapi: 3.1.0
info:
  title: HIMS Configurator API
  version: 1.3.0
  description: |
    Configurator module — tenant registry, module enablement, feature flag overrides, configuration management.

    ## Changelog

    ### 1.3.0
    - Tenant API keys for external integrations (OPD slip PDF): CRUD under `/tenants/{tenantId}/api-keys`.

    ### 1.2.2
    - Branding logo upload APIs for organisation and tenant creation (`POST /branding-logos/organization`,
      `POST /branding-logos/tenant`, `GET /branding-logos/download`). Logos are stored in Azure Blob Storage
      (same container as OPD patient documents) and referenced from `metadata.logo` on organisation/tenant rows.

    ### 1.2.0
    - Tenant integration profiles (ABDM Phase 1a): CRUD under `/tenants/{tenantId}/integration-profiles`.
    - Internal routes `GET /integration-profiles/by-hip/{hipId}` and
      `GET /integration-profiles/by-tenant/{tenantId}` for service-to-service credential lookup
      (requires `x-configurator-internal-key` when `CONFIGURATOR_INTERNAL_API_KEY` is set).
    ### 1.2.1
    - Revert identifier to platform default via PUT with `is_custom: false` (DELETE endpoint removed).
    - `sequence_configuration` rows are never hard-deleted when overrides are cleared.

    ### 1.2.0
    - Sequence configuration APIs for tenant-wise identifier format templates (`/sequence-configurations`, `/tenants/{tenantId}/sequence-configuration/*`).

    ### 1.1.0 (breaking)
    - POST /tenant-onboarding: `tenant` is now a required top-level field separate from `organization`.
      Old payloads that embedded tenant fields inside `organization` will fail schema validation.
    - POST /organizations: response is the `Organization` schema directly (includes `created_by`).
      The legacy `OrganizationWithDefaultTenantResponse` shape is deprecated.
servers:
  - url: /api/configurator/v1
security:
  - bearerAuth: []
paths:
  /organizations:
    get:
      operationId: listOrganizations
      summary: List organizations
      description: Returns all registered organizations, optionally filtered by status or type.
      tags:
        - Organizations
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrganizationStatus"
          description: Filter by organization status.
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrganizationType"
          description: Filter by organization type.
      responses:
        "200":
          description: List of organizations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
    post:
      operationId: createOrganization
      summary: Create organization
      description: >
        Creates an organization record only. Tenants are provisioned separately via
        POST /tenant-onboarding (or POST /tenants under an existing organization).
      tags:
        - Organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Validation or business rule failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /organizations/{id}:
    get:
      operationId: getOrganizationById
      summary: Get organization by id
      tags:
        - Organizations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Organization not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrganization
      summary: Update organization
      tags:
        - Organizations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationPatchRequest"
      responses:
        "200":
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Validation or business rule failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /branding-logos/organization:
    post:
      operationId: uploadOrganizationBrandingLogo
      summary: Upload organisation branding logo
      description: >
        Multipart upload for organisation logos during tenant onboarding. Stores the file in Azure Blob
        Storage and returns metadata to embed in `organization.metadata.logo` when calling POST /tenant-onboarding.
      tags:
        - Branding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - slug
              properties:
                slug:
                  type: string
                  minLength: 3
                  description: Organisation slug used for blob path namespacing.
                file:
                  type: string
                  format: binary
                  description: PNG or JPEG image up to 2 MB.
      responses:
        "201":
          description: Logo uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingLogoUploadResponse"
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Platform super-admin role required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Azure Blob Storage unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /branding-logos/tenant:
    post:
      operationId: uploadTenantBrandingLogo
      summary: Upload tenant branding logo
      description: >
        Multipart upload for tenant logos during tenant onboarding. Stores the file in Azure Blob Storage
        and returns metadata to embed in `tenant.metadata.logo` when calling POST /tenant-onboarding.
      tags:
        - Branding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - slug
              properties:
                slug:
                  type: string
                  minLength: 3
                  description: Tenant slug used for blob path namespacing.
                file:
                  type: string
                  format: binary
                  description: PNG or JPEG image up to 2 MB.
      responses:
        "201":
          description: Logo uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingLogoUploadResponse"
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Azure Blob Storage unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /branding-logos/download:
    get:
      operationId: downloadBrandingLogo
      summary: Download branding logo
      description: >
        Streams a branding logo from Azure Blob Storage by `storage_key` (same-origin proxy; avoids browser CORS to Azure).
      tags:
        - Branding
      parameters:
        - name: storage_key
          in: query
          required: true
          schema:
            type: string
          description: Blob storage key returned from a branding logo upload response.
      responses:
        "200":
          description: Logo image bytes.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid storage key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Azure Blob Storage unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants:
    get:
      operationId: listTenants
      summary: List tenants
      description: Returns all registered tenants, optionally filtered by org, status, or type.
      tags:
        - Tenants
      parameters:
        - name: org_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter tenants by parent organization.
        - name: parent_tenant_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only tenants with this parent tenant (e.g. branches under the root tenant).
        - name: is_root
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "1", "false", "0"]
          description: When `true` or `1`, only tenants with no parent (organization root tenants).
        - name: provisioning_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProvisioningStatus"
          description: Filter by provisioning status.
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TenantType"
          description: Filter by tenant type.
      responses:
        "200":
          description: List of tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
    post:
      operationId: createTenant
      summary: Create tenant
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreateRequest"
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Validation, unknown organization, or invalid provisioning transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate tenant slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{id}:
    get:
      operationId: getTenantById
      summary: Get tenant by id
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
      responses:
        "200":
          description: Tenant found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTenant
      summary: Update tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantPatchRequest"
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Validation, unknown organization, or invalid provisioning transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate tenant slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/modules:
    get:
      operationId: listTenantModules
      summary: List tenant module enablement
      description: Returns module enablement rows for a tenant, optionally filtered by enablement state.
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by current active state.
      responses:
        "200":
          description: List of tenant module rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModuleListResponse"
    post:
      operationId: createTenantModule
      summary: Enable a module for a tenant
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantModuleCreateRequest"
      responses:
        "201":
          description: Tenant module enablement created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModule"
        "400":
          description: Validation or unknown tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Module already enabled for tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/modules/{moduleId}:
    get:
      operationId: getTenantModuleByKey
      summary: Get tenant module enablement
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant module row found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModule"
        "404":
          description: Tenant module not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTenantModule
      summary: Update tenant module enablement
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantModulePatchRequest"
      responses:
        "200":
          description: Updated tenant module row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModule"
        "400":
          description: Validation failure or core module disable attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tenant module not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTenantModule
      summary: Delete tenant module enablement
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tenant module row deleted.
        "404":
          description: Tenant module not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /integration-profiles/by-hip/{hipId}:
    get:
      operationId: getActiveIntegrationProfileByHipId
      summary: Resolve active integration profile by HIP id (internal)
      description: >
        **Internal / service-to-service only.** Returns the active integration profile for callback
        routing and gateway credential resolution (includes `client_secret` in plaintext for Phase 1a).
        Not for browser or public clients. When `CONFIGURATOR_INTERNAL_API_KEY` is configured on the
        service, callers must send matching `x-configurator-internal-key`. In local dev the check is
        skipped if the env var is unset.
      tags:
        - Integration Profiles
      security:
        - internalServiceKey: []
      parameters:
        - name: hipId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: integration_kind
  /sequence-configurations:
    get:
      operationId: listSequenceConfigurations
      summary: List tenants with sequence configuration summaries
      tags:
        - Sequence Configuration
      parameters:
        - name: org_id
          in: query
          required: false
          schema:
            type: string
            enum: [abdm]
            default: abdm
      responses:
        "200":
          description: Active profile for the HIP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantIntegrationProfile"
        "403":
          description: Missing or invalid internal service key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No active profile for this HIP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /integration-profiles/by-tenant/{tenantId}:
    get:
      operationId: getActiveIntegrationProfileByTenantId
      summary: Resolve active integration profile by tenant id (internal)
      description: >
        **Internal / service-to-service only.** Returns the active ABDM integration profile for a
        tenant (includes `client_secret` in plaintext for Phase 1a). Not for browser or public clients.
        When `CONFIGURATOR_INTERNAL_API_KEY` is configured on the service, callers must send matching
        `x-configurator-internal-key`. In local dev the check is skipped if the env var is unset.
      tags:
        - Integration Profiles
      security:
        - internalServiceKey: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: integration_kind
          in: query
          schema:
            type: string
            enum: [abdm]
      responses:
        "200":
          description: Active profile for the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantIntegrationProfile"
        "403":
          description: Missing or invalid internal service key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No active profile for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/integration-profiles:
    get:
      operationId: listTenantIntegrationProfiles
      summary: List tenant integration profiles
      tags:
        - Integration Profiles
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: integration_kind
          in: query
          schema:
            type: string
            enum: [abdm]
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Profile list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantIntegrationProfileListResponse"
    post:
      operationId: createTenantIntegrationProfile
      summary: Create tenant integration profile
      tags:
        - Integration Profiles
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantIntegrationProfileCreateRequest"
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantIntegrationProfile"
        "409":
          description: Duplicate tenant + integration_kind or active HIP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/integration-profiles/{profileId}:
    get:
      operationId: getTenantIntegrationProfileById
      summary: Get tenant integration profile
      tags:
        - Integration Profiles
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantIntegrationProfile"
        "404":
          description: Profile not found.
            format: uuid
        - name: provisioning_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProvisioningStatus"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SequenceConfigurationStatus"
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Substring match on tenant name or tenant numeric code.
      responses:
        "200":
          description: Tenant sequence configuration summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SequenceConfigurationListResponse"
  /tenants/{tenantId}/sequence-configuration:
    get:
      operationId: getSequenceConfiguration
      summary: Get sequence configuration for a tenant
      tags:
        - Sequence Configuration
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      responses:
        "200":
          description: Effective sequence configuration for all identifier types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SequenceConfigurationDetail"
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTenantIntegrationProfile
      summary: Update tenant integration profile
      tags:
        - Integration Profiles
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /tenants/{tenantId}/sequence-configuration/identifiers/{identifierType}:
    put:
      operationId: upsertSequenceIdentifier
      summary: Customize or revert an identifier format for a tenant
      description: >
        Set a custom format with `is_custom: true` and `segments`, or revert to the
        platform default with `is_custom: false` (no segments required).
      tags:
        - Sequence Configuration
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - $ref: "#/components/parameters/IdentifierTypePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantIntegrationProfilePatchRequest"
      responses:
        "200":
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantIntegrationProfile"
        "404":
          description: Profile not found.
              $ref: "#/components/schemas/SequenceIdentifierUpsertRequest"
      responses:
        "200":
          description: Identifier configuration saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SequenceIdentifierConfig"
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTenantIntegrationProfile
      summary: Delete tenant integration profile
      tags:
        - Integration Profiles
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Profile deleted.
        "404":
          description: Profile not found.
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenant-onboarding:
    post:
      operationId: provisionTenant
      summary: Full tenant onboarding
      description: >
        One-shot endpoint that creates/reuses an organization, provisions a tenant,
        enables modules, provisions the admin role/user, and publishes domain events.
      tags:
        - Tenant Onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionTenantInput"
      responses:
        "201":
          description: Tenant successfully provisioned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionTenantResult"
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Organization or tenant slug conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/api-keys:
    get:
      operationId: listTenantApiKeys
      summary: List tenant API keys
      description: Returns API keys for a tenant (prefix and metadata only — never the secret).
      tags:
        - API Keys
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TenantApiKeyStatus"
      responses:
        "200":
          description: API keys for the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantApiKeyListResponse"
    post:
      operationId: createTenantApiKey
      summary: Create tenant API key
      description: |
        Creates a new API key for external integrations. The plaintext `secret` is returned once in the
        response and cannot be retrieved again.
      tags:
        - API Keys
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantApiKeyCreateRequest"
      responses:
        "201":
          description: API key created (includes one-time secret).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantApiKeyCreateResponse"
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/api-keys/{apiKeyId}:
    patch:
      operationId: updateTenantApiKeyStatus
      summary: Enable, disable, or revoke a tenant API key
      tags:
        - API Keys
      parameters:
        - $ref: "#/components/parameters/TenantIdPath"
        - name: apiKeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantApiKeyStatusPatchRequest"
      responses:
        "200":
          description: Updated API key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantApiKey"
        "404":
          description: API key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceKey:
      type: apiKey
      in: header
      name: x-configurator-internal-key
      description: >
        Shared secret for internal routes (e.g. by-hip profile lookup). Must match
        CONFIGURATOR_INTERNAL_API_KEY on configurator-svc.
  parameters:
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant primary key (`iq_tenant_id`).
    IdentifierTypePath:
      name: identifierType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IdentifierType"
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable code when applicable (e.g. CONFLICT).
    OrganizationType:
      type: string
      enum:
        - hospital_chain
        - medical_college
        - standalone_hospital
        - government_network
    OrganizationStatus:
      type: string
      enum:
        - active
        - suspended
        - decommissioned
    TenantType:
      type: string
      enum:
        - full_platform
        - fragmented
        - lite
    BranchType:
      type: string
      enum:
        - hub_lab
        - hub
        - satellite
    ProvisioningStatus:
      type: string
      enum:
        - provisioning
        - active
        - suspended
        - decommissioned
    DataIsolationLevel:
      type: string
      enum:
        - shared
        - isolated
    BrandingLogoMetadata:
      type: object
      required:
        - storage_key
        - blob_url
        - mime_type
        - file_name
        - uploaded_at
      properties:
        storage_key:
          type: string
          description: Azure Blob storage key under the shared patient-documents container.
        blob_url:
          type: string
          format: uri
          description: Direct blob URL (use download endpoint for browser display).
        mime_type:
          type: string
          description: image/png or image/jpeg
        file_name:
          type: string
        uploaded_at:
          type: string
          format: date-time
    BrandingLogoUploadResponse:
      type: object
      required:
        - logo
      properties:
        logo:
          $ref: "#/components/schemas/BrandingLogoMetadata"
    OrganizationWithDefaultTenantResponse:
      deprecated: true
      description: >
        Legacy response shape. POST /organizations now returns Organization only;
        use POST /tenant-onboarding to provision a tenant and modules.
      type: object
      required:
        - organization
        - default_tenant
        - tenant_modules
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        default_tenant:
          $ref: "#/components/schemas/Tenant"
        tenant_modules:
          type: array
          description: Tenant module rows created for the default tenant (empty if none requested).
          items:
            $ref: "#/components/schemas/TenantModule"
    OrganizationCreateRequest:
      type: object
      required:
        - name
        - slug
        - type
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 3
          description: URL-safe identifier; minimum 3 characters.
        type:
          $ref: "#/components/schemas/OrganizationType"
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        contact_email:
          type: string
        contact_phone:
