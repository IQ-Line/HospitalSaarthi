        - tenant_name
        - status
        - configured_at
        - identifiers
      properties:
        iq_tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        tenant_numeric_code:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/SequenceConfigurationStatus"
        configured_at:
          type: string
          format: date-time
          nullable: true
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/SequenceIdentifierConfig"
    TenantApiKeyStatus:
      type: string
      enum: [active, disabled, revoked]
    TenantApiKeyEnvironment:
      type: string
      enum: [live, test]
    TenantApiKeyPurpose:
      type: string
      enum: [opd_slip]
    TenantApiKey:
      type: object
      required:
        - api_key_id
        - iq_tenant_id
        - key_prefix
        - purpose
        - environment
        - status
        - created_at
        - updated_at
      properties:
        api_key_id:
          type: string
          format: uuid
        iq_tenant_id:
          type: string
          format: uuid
        key_prefix:
          type: string
        label:
          type: string
          nullable: true
        purpose:
          $ref: "#/components/schemas/TenantApiKeyPurpose"
        environment:
          $ref: "#/components/schemas/TenantApiKeyEnvironment"
        status:
          $ref: "#/components/schemas/TenantApiKeyStatus"
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
    TenantApiKeyListResponse:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantApiKey"
        total:
          type: integer
          minimum: 0
    TenantApiKeyCreateRequest:
      type: object
      required:
        - environment
      properties:
        label:
          type: string
          maxLength: 120
          nullable: true
        environment:
          $ref: "#/components/schemas/TenantApiKeyEnvironment"
        expires_at:
          type: string
          format: date-time
          nullable: true
    TenantApiKeyCreateResponse:
      allOf:
        - $ref: "#/components/schemas/TenantApiKey"
        - type: object
          required:
            - secret
          properties:
            secret:
              type: string
              description: Plaintext API key — shown once at creation.
    TenantApiKeyStatusPatchRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/TenantApiKeyStatus"
    SequenceIdentifierUpsertRequest:
      type: object
      required:
        - is_custom
      properties:
        is_custom:
          type: boolean
        segments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SequenceFormatSegment"
      allOf:
        - if:
            properties:
              is_custom:
                const: true
            required:
              - is_custom
          then:
            required:
              - is_custom
              - segments
        - if:
            properties:
              is_custom:
                const: false
            required:
              - is_custom
          then:
            not:
              required:
                - segments
