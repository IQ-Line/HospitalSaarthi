openapi: 3.1.0
info:
  title: HIMS Configurator API
  version: 1.0.0
  description: Configurator module — tenant registry, module enablement, feature flag overrides, configuration management.
servers:
  - url: /api/configurator/v1
security:
  - bearerAuth: []
paths:
  /organizations:
    get:
      operationId: listOrganizations
      summary: List organizations
      description: Returns all registered organizations, optionally filtered by status or type.
      tags:
        - Organizations
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrganizationStatus"
          description: Filter by organization status.
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrganizationType"
          description: Filter by organization type.
      responses:
        "200":
          description: List of organizations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationListResponse"
    post:
      operationId: createOrganization
      summary: Create organization
      description: Creates the organization and a root default tenant (same name/slug, full_platform, provisioning, shared isolation; cerbos_scope_key is tenant:{organization.id}).
      tags:
        - Organizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "201":
          description: Organization and default tenant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationWithDefaultTenantResponse"
        "400":
          description: Validation or business rule failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /organizations/{id}:
    get:
      operationId: getOrganizationById
      summary: Get organization by id
      tags:
        - Organizations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Organization not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrganization
      summary: Update organization
      tags:
        - Organizations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationPatchRequest"
      responses:
        "200":
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Validation or business rule failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants:
    get:
      operationId: listTenants
      summary: List tenants
      description: Returns all registered tenants, optionally filtered by org, status, or type.
      tags:
        - Tenants
      parameters:
        - name: org_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter tenants by parent organization.
        - name: provisioning_status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProvisioningStatus"
          description: Filter by provisioning status.
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TenantType"
          description: Filter by tenant type.
      responses:
        "200":
          description: List of tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
    post:
      operationId: createTenant
      summary: Create tenant
      tags:
        - Tenants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreateRequest"
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Validation, unknown organization, or invalid provisioning transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate tenant slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{id}:
    get:
      operationId: getTenantById
      summary: Get tenant by id
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
      responses:
        "200":
          description: Tenant found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTenant
      summary: Update tenant
      tags:
        - Tenants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantPatchRequest"
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Validation, unknown organization, or invalid provisioning transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate tenant slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/modules:
    get:
      operationId: listTenantModules
      summary: List tenant module enablement
      description: Returns module enablement rows for a tenant, optionally filtered by enablement state.
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by current active state.
      responses:
        "200":
          description: List of tenant module rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModuleListResponse"
    post:
      operationId: createTenantModule
      summary: Enable a module for a tenant
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant primary key (`iq_tenant_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantModuleCreateRequest"
      responses:
        "201":
          description: Tenant module enablement created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModule"
        "400":
          description: Validation or unknown tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Module already enabled for tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tenants/{tenantId}/modules/{moduleId}:
    get:
      operationId: getTenantModuleByKey
      summary: Get tenant module enablement
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant module row found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModule"
        "404":
          description: Tenant module not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTenantModule
      summary: Update tenant module enablement
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantModulePatchRequest"
      responses:
        "200":
          description: Updated tenant module row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantModule"
        "400":
          description: Validation failure or core module disable attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tenant module not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTenantModule
      summary: Delete tenant module enablement
      tags:
        - Tenant Modules
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tenant module row deleted.
        "404":
          description: Tenant module not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable code when applicable (e.g. CONFLICT).
    OrganizationType:
      type: string
      enum:
        - hospital_chain
        - medical_college
        - standalone_hospital
        - government_network
    OrganizationStatus:
      type: string
      enum:
        - active
        - suspended
        - decommissioned
    TenantType:
      type: string
      enum:
        - full_platform
        - fragmented
        - lite
    ProvisioningStatus:
      type: string
      enum:
        - provisioning
        - active
        - suspended
        - decommissioned
    DataIsolationLevel:
      type: string
      enum:
        - shared
        - isolated
    OrganizationWithDefaultTenantResponse:
      type: object
      required:
        - organization
        - default_tenant
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        default_tenant:
          $ref: "#/components/schemas/Tenant"
    OrganizationCreateRequest:
      type: object
      required:
        - name
        - slug
        - type
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/OrganizationType"
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        contact_email:
          type: string
        contact_phone:
          type: string
        address:
          type: string
        metadata:
          type: object
    OrganizationPatchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/OrganizationType"
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        contact_email:
          type:
            - string
            - "null"
        contact_phone:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
    TenantCreateRequest:
      type: object
      required:
        - org_id
        - name
        - slug
        - type
        - cerbos_scope_key
      properties:
        org_id:
          type: string
          format: uuid
        parent_tenant_id:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/TenantType"
        provisioning_status:
          $ref: "#/components/schemas/ProvisioningStatus"
        data_isolation_level:
          $ref: "#/components/schemas/DataIsolationLevel"
        cerbos_scope_key:
          type: string
          minLength: 1
        timezone:
          type: string
        locale:
          type: string
        metadata:
          type:
            - object
            - "null"
    TenantPatchRequest:
      type: object
      properties:
        org_id:
          type: string
          format: uuid
        parent_tenant_id:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/TenantType"
        provisioning_status:
          $ref: "#/components/schemas/ProvisioningStatus"
        data_isolation_level:
          $ref: "#/components/schemas/DataIsolationLevel"
        cerbos_scope_key:
          type: string
          minLength: 1
        timezone:
          type: string
        locale:
          type: string
        metadata:
          type:
            - object
            - "null"
    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - type
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples:
            - AIIMS
        slug:
          type: string
          examples:
            - aiims
        type:
          $ref: "#/components/schemas/OrganizationType"
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        address:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
    OrganizationListResponse:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        total:
          type: integer
          minimum: 0
    Tenant:
      type: object
      required:
        - iq_tenant_id
        - org_id
        - name
        - slug
        - type
        - provisioning_status
        - data_isolation_level
        - cerbos_scope_key
        - timezone
        - locale
        - created_at
        - updated_at
      properties:
        iq_tenant_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        parent_tenant_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          examples:
            - AIIMS Delhi
        slug:
          type: string
          examples:
            - aiims-delhi
        type:
          $ref: "#/components/schemas/TenantType"
        provisioning_status:
          $ref: "#/components/schemas/ProvisioningStatus"
        data_isolation_level:
          type: string
          enum:
            - shared
            - isolated
        cerbos_scope_key:
          type: string
        timezone:
          type: string
          examples:
            - Asia/Kolkata
        locale:
          type: string
          examples:
            - en-IN
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
    TenantListResponse:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
          minimum: 0
    TenantModuleCreateRequest:
      type: object
      required:
        - module_id
      properties:
        module_id:
          type: string
          format: uuid
        is_active:
          type: boolean
          default: true
        is_core_override:
          type: boolean
          default: false
        created_by:
          type: string
          format: uuid
          nullable: true
    TenantModulePatchRequest:
      type: object
      properties:
        is_active:
          type: boolean
        is_core_override:
          type: boolean
        updated_by:
          type: string
          format: uuid
          nullable: true
    TenantModule:
      type: object
      required:
        - iq_tenant_id
        - module_id
        - is_active
        - is_core_override
        - created_at
        - updated_at
      properties:
        iq_tenant_id:
          type: string
          format: uuid
        module_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        is_core_override:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
    TenantModuleListResponse:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantModule"
        total:
          type: integer
          minimum: 0
