openapi: 3.1.0
info:
  title: Pharmacy API
  version: 1.0.0
  description: >
    Pharmacy counter module — OPD visit queue (including in-progress consults with
    prescriptions), walk-in counter orders, free-text prescription lines from OPD,
    manual quantity and amount billing stored in pharmacy schema. One dispense record
    per visit (no draft/finalize sessions). No payment or Billing module in v1.
servers:
  - url: https://api.{tenant_slug}.hims.example/api/pharmacy/v1
    variables:
      tenant_slug:
        default: demo
security:
  - bearerAuth: []
tags:
  - name: Queue
    description: OPD visits with prescriptions and walk-in dispense orders.
  - name: Dispense
    description: Per-visit dispense record and line items.
  - name: Returns
    description: Return medicines against completed dispense transactions (amounts stored in pharmacy schema; no billing refund in v1).
paths:
  /queue:
    get:
      operationId: listPharmacyQueue
      summary: List pharmacy queue rows (OPD prescriptions or walk-in orders)
      description: |
        OPD prescriptions (`kind=opd`) are read from `pharmacy.queue_projection` (rows pushed by
        OPD on prescription finalize). Walk-in orders (`kind=walk_in`) are read from pharmacy
        dispense records.
      tags: [Queue]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: queued_from
          in: query
          schema: { type: string, format: date }
          description: Filter by queue date (visit updated_at) — start of range, inclusive.
        - name: queued_to
          in: query
          schema: { type: string, format: date }
          description: Filter by queue date (visit updated_at) — end of range, inclusive.
        - name: q
          in: query
          schema: { type: string }
          description: >
            Case-insensitive search across patient name, UHID, visit id, prescription id,
            formatted Rx token, and doctor name.
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, partial_issue, issued]
            default: all
          description: Filter by dispense status (pending = no saved dispense, partial_issue = incomplete fulfillment, issued = fully dispensed).
        - name: doctor_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter by prescribing doctor id.
        - name: kind
          in: query
          schema:
            type: string
            enum: [opd, walk_in]
            default: opd
          description: Queue source — OPD projection table (`opd`) or walk-in counter orders (`walk_in`).
      responses:
        "200":
          description: Queue page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PharmacyQueueResponse" }
  /internal/opd-queue-projection/{visitId}:
    put:
      operationId: upsertOpdQueueProjection
      summary: Upsert OPD prescription row into pharmacy queue projection (service-to-service)
      description: |
        Called by OPD when a consultation is completed with a final prescription. Idempotent on
        `(iq_tenant_id, visit_id)`. Rows that fail pharmacy eligibility rules are removed.
        Requires `iq_tenant_id` header and `x-pharmacy-internal-key` when
        `PHARMACY_INTERNAL_API_KEY` is configured on pharmacy-svc. Cerbos is not enforced.
      tags: [Queue]
      security:
        - internalServiceKey: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpdQueueProjectionUpsertRequest" }
      responses:
        "200":
          description: Projection row upserted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpdQueueProjectionRow" }
        "204":
          description: Visit is not eligible for the pharmacy queue; projection row removed if present
        "400":
          description: Invalid payload
    delete:
      operationId: removeOpdQueueProjection
      summary: Remove a visit from the pharmacy queue projection
      tags: [Queue]
      security:
        - internalServiceKey: []
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Row removed or already absent
  /visits/{visitId}/dispense-order:
    get:
      operationId: getDispenseForVisit
      summary: Get OPD prescription and saved dispense lines for a visit
      tags: [Dispense]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Dispense detail with OPD prescription context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseForVisitResponse" }
        "404":
          description: Visit has no OPD prescription
        "502":
          description: Upstream failure
    put:
      operationId: saveDispenseForVisit
      summary: Save dispense lines and totals for a visit (upsert record, replace lines)
      tags: [Dispense]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveDispenseForVisitRequest" }
      responses:
        "200":
          description: Saved dispense record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseForVisitResponse" }
        "400":
          description: Validation or patient mismatch
        "404":
          description: Visit has no OPD prescription
        "502":
          description: Upstream or persistence failure
  /walk-in-dispense-orders:
    post:
      operationId: createWalkInDispenseOrder
      summary: Create a walk-in dispense order with pharmacy-local patient details
      tags: [Dispense]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveWalkInDispenseRequest" }
      responses:
        "201":
          description: Created walk-in dispense order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalkInDispenseResponse" }
        "400":
          description: Validation error
  /walk-in-dispense-orders/{recordId}:
    get:
      operationId: getWalkInDispenseOrder
      summary: Get a walk-in dispense order by record id
      tags: [Dispense]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Walk-in dispense order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalkInDispenseResponse" }
        "404":
          description: Order not found
    put:
      operationId: updateWalkInDispenseOrder
      summary: Update walk-in patient details and replace dispense lines
      tags: [Dispense]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: recordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveWalkInDispenseRequest" }
      responses:
        "200":
          description: Updated walk-in dispense order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalkInDispenseResponse" }
        "400":
          description: Validation error
        "404":
          description: Order not found
  /dispense-transactions/search:
    get:
      operationId: searchDispenseForReturn
      summary: Search completed dispense transactions eligible for return
      description: |
        At least one search parameter is required. Only dispense records with status
        `issued`, `partial_issue`, or `partially_returned` are returned.
      tags: [Returns]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - name: bill_number
          in: query
          schema: { type: string }
          description: Matches dispense record id prefix (pharmacy-local bill reference).
        - name: dispense_number
          in: query
          schema: { type: string }
          description: Matches dispense record id prefix.
        - name: prescription_number
          in: query
          schema: { type: string }
          description: Matches OPD prescription id or formatted token.
        - name: uhid
          in: query
          schema: { type: string }
        - name: patient_name
          in: query
          schema: { type: string }
        - name: mobile
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
          description: General search across patient, UHID, visit, prescription, and dispense id.
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseReturnSearchResponse" }
        "400":
          description: No search criterion provided
  /dispense-transactions/{dispenseId}/return-eligibility:
    get:
      operationId: getDispenseReturnEligibility
      summary: Dispense header and line eligibility for processing a return
      tags: [Returns]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: dispenseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Return eligibility detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseReturnEligibilityResponse" }
        "404":
          description: Dispense not found or not eligible for return
  /returns:
    get:
      operationId: listDispenseReturns
      summary: List processed dispense returns
      tags: [Returns]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - name: q
          in: query
          schema: { type: string }
          description: Search return number, patient name, UHID, or dispense id.
      responses:
        "200":
          description: Return list page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseReturnListResponse" }
    post:
      operationId: processDispenseReturn
      summary: Process a medicine return against a dispense transaction
      description: |
        Idempotent when `Idempotency-Key` header is supplied. Updates cumulative returned
        quantities on dispense lines and dispense status. Amounts are stored in pharmacy
        schema only (no billing or inventory integration in v1).
      tags: [Returns]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProcessDispenseReturnRequest" }
      responses:
        "201":
          description: Return processed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseReturnDetail" }
        "400":
          description: Validation error
        "404":
          description: Dispense or line not found
        "409":
          description: Duplicate or ineligible return
  /returns/{returnId}:
    get:
      operationId: getDispenseReturn
      summary: Get a processed return by id
      tags: [Returns]
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: returnId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Return detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispenseReturnDetail" }
        "404":
          description: Return not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalServiceKey:
      type: apiKey
      in: header
      name: x-pharmacy-internal-key
      description: |
        Shared secret for internal routes (OPD queue projection push). Must match
        PHARMACY_INTERNAL_API_KEY on pharmacy-svc. Optional in local dev when unset.
  parameters:
    TenantIdHeader:
      name: iq_tenant_id
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: Optional idempotency key for return processing.
  schemas:
    PharmacyQueueItem:
      type: object
      required:
        - walk_in_order
        - visit_status
        - updated_at
        - queued_at
        - priority
        - has_dispense
        - dispense_status
        - medicine_count
      properties:
        walk_in_order:
          type: boolean
          description: True for counter walk-in dispense orders without an OPD visit.
        record_id:
          type: string
          format: uuid
          nullable: true
          description: Pharmacy dispense record id for walk-in orders.
        visit_id:
          type: string
          format: uuid
          nullable: true
        patient_id:
          type: string
          format: uuid
          nullable: true
        walk_in_patient_id:
          type: string
          format: uuid
          nullable: true
        prescription_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        visit_status: { type: string }
        prescription_status: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
        queued_at:
          type: string
          format: date-time
          description: When the prescription entered the pharmacy queue.
        finalized_at: { type: string, format: date-time, nullable: true }
        priority:
          type: string
          enum: [routine, urgent, stat]
          description: Dispense priority — stat maps to emergency in UI.
        medicine_count:
          type: integer
          minimum: 0
        patient_name: { type: string, nullable: true }
        uhid: { type: string, nullable: true }
        phone:
          type: string
          nullable: true
          description: Walk-in patient phone when walk_in_order is true.
        age_years: { type: integer, nullable: true }
        gender: { type: string, nullable: true }
        doctor_name:
          type: string
          nullable: true
          description: Prescribing doctor display name from user management.
        formatted_visit_id:
          type: string
          nullable: true
          description: Human-readable visit number from registration (e.g. OP2606090000019).
        has_dispense:
          type: boolean
          description: True when a dispense record exists for this queue row.
        dispense_status:
          $ref: "#/components/schemas/PharmacyDispenseStatus"
    PharmacyDispenseStatus:
      type: string
      enum: [pending, issued, partial_issue, partially_returned, fully_returned]
    DispenseReturnReason:
      type: string
      enum:
        - wrong_medicine_dispensed
        - doctor_discontinued_medication
        - duplicate_dispensing
        - excess_quantity_dispensed
        - patient_refused_medicine
        - other
    DispenseReturnVerification:
      type: object
      required: [unopened, packaging_intact, expiry_verified]
      properties:
        unopened: { type: boolean }
        packaging_intact: { type: boolean }
        expiry_verified: { type: boolean }
    DispenseReturnSearchHit:
      type: object
      required:
        - dispense_id
        - dispense_number
        - visit_id
        - patient_id
        - dispense_date
        - dispense_status
        - total_amount
      properties:
        dispense_id: { type: string, format: uuid }
        dispense_number: { type: string }
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string, nullable: true }
        uhid: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        formatted_visit_id: { type: string, nullable: true }
        prescription_id: { type: string, format: uuid, nullable: true }
        dispense_date: { type: string, format: date-time }
        dispense_status: { $ref: "#/components/schemas/PharmacyDispenseStatus" }
        total_amount: { type: string }
        pharmacist_id: { type: string, format: uuid, nullable: true }
    DispenseReturnSearchResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DispenseReturnSearchHit" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    DispenseReturnEligibleLine:
      type: object
      required:
        - dispense_line_item_id
        - medicine_display_name
        - quantity_dispensed
        - quantity_returned
        - eligible_return_qty
        - unit_amount
        - line_discount
        - tax_percent
        - tax_amount
        - line_total
      properties:
        dispense_line_item_id: { type: string, format: uuid }
        medicine_id: { type: string, format: uuid, nullable: true }
        medicine_display_name: { type: string }
        stock_batch_id: { type: string, format: uuid, nullable: true }
        batch_number: { type: string, nullable: true }
        expiry_date: { type: string, format: date, nullable: true }
        quantity_dispensed: { type: string }
        quantity_returned: { type: string }
        eligible_return_qty: { type: string }
        unit_amount: { type: string }
        line_discount: { type: string }
        tax_percent: { type: string }
        tax_amount: { type: string }
        line_total: { type: string }
    DispenseReturnEligibilityResponse:
      type: object
      required:
        - dispense_id
        - dispense_number
        - visit_id
        - patient_id
        - dispense_date
        - dispense_status
        - total_amount
        - lines
      properties:
        dispense_id: { type: string, format: uuid }
        dispense_number: { type: string }
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string, nullable: true }
        uhid: { type: string, nullable: true }
        formatted_visit_id: { type: string, nullable: true }
        prescription_id: { type: string, format: uuid, nullable: true }
        dispense_date: { type: string, format: date-time }
        dispense_status: { $ref: "#/components/schemas/PharmacyDispenseStatus" }
        total_amount: { type: string }
        inventory_store_id: { type: string, format: uuid, nullable: true }
        pharmacist_id: { type: string, format: uuid, nullable: true }
        pharmacist_name: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DispenseReturnEligibleLine" }
    ProcessDispenseReturnLineInput:
      type: object
      required: [dispense_line_item_id, return_qty]
      properties:
        dispense_line_item_id: { type: string, format: uuid }
        return_qty: { type: string }
        stock_batch_id:
          type: string
          format: uuid
          nullable: true
          description: Must match the original dispense line batch when set.
    ProcessDispenseReturnRequest:
      type: object
      required: [dispense_id, return_reason, verification, lines]
      properties:
        dispense_id: { type: string, format: uuid }
        return_reason: { $ref: "#/components/schemas/DispenseReturnReason" }
        remarks:
          type: string
          nullable: true
          description: Required when return_reason is `other`.
        verification: { $ref: "#/components/schemas/DispenseReturnVerification" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProcessDispenseReturnLineInput" }
    DispenseReturnLineDetail:
      type: object
      required:
        - id
        - dispense_line_item_id
        - medicine_display_name
        - return_qty
        - unit_amount
        - line_discount
        - tax_amount
        - return_amount
      properties:
        id: { type: string, format: uuid }
        dispense_line_item_id: { type: string, format: uuid }
        medicine_id: { type: string, format: uuid, nullable: true }
        medicine_display_name: { type: string }
        stock_batch_id: { type: string, format: uuid, nullable: true }
        return_qty: { type: string }
        unit_amount: { type: string }
        line_discount: { type: string }
        tax_amount: { type: string }
        return_amount: { type: string }
    DispenseReturnSummary:
      type: object
      required:
        - id
        - return_number
        - dispense_id
        - return_reason
        - total_return_amount
        - processed_at
        - patient_name
        - uhid
      properties:
        id: { type: string, format: uuid }
        return_number: { type: string }
        dispense_id: { type: string, format: uuid }
        dispense_number: { type: string }
        return_reason: { $ref: "#/components/schemas/DispenseReturnReason" }
        total_return_amount: { type: string }
        processed_at: { type: string, format: date-time }
        patient_name: { type: string, nullable: true }
        uhid: { type: string, nullable: true }
        formatted_visit_id: { type: string, nullable: true }
    DispenseReturnListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DispenseReturnSummary" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    DispenseReturnDetail:
      type: object
      required:
        - id
        - return_number
        - dispense_id
        - dispense_number
        - visit_id
        - patient_id
        - return_reason
        - verification
        - total_return_amount
        - processed_at
        - processed_by
        - lines
      properties:
        id: { type: string, format: uuid }
        return_number: { type: string }
        dispense_id: { type: string, format: uuid }
        dispense_number: { type: string }
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        patient_name: { type: string, nullable: true }
        uhid: { type: string, nullable: true }
        formatted_visit_id: { type: string, nullable: true }
        prescription_id: { type: string, format: uuid, nullable: true }
        return_reason: { $ref: "#/components/schemas/DispenseReturnReason" }
        remarks: { type: string, nullable: true }
        verification: { $ref: "#/components/schemas/DispenseReturnVerification" }
        total_return_amount: { type: string }
        processed_at: { type: string, format: date-time }
        processed_by: { type: string, format: uuid, nullable: true }
        processed_by_name: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DispenseReturnLineDetail" }
    OpdQueueProjectionUpsertRequest:
      type: object
      required:
        - patient_id
        - prescription_id
        - visit_status
        - prescription_status
        - medicine_count
        - updated_at
      properties:
        patient_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid, nullable: true }
        visit_status: { type: string }
        prescription_status: { type: string }
        medicine_count: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        finalized_at: { type: string, format: date-time, nullable: true }
        patient_name: { type: string, nullable: true }
        uhid: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        age_years: { type: integer, nullable: true }
        gender: { type: string, nullable: true }
        doctor_name: { type: string, nullable: true }
        formatted_visit_id: { type: string, nullable: true }
    OpdQueueProjectionRow:
      type: object
      required:
        - visit_id
        - patient_id
        - prescription_id
        - visit_status
        - prescription_status
        - medicine_count
        - queued_at
        - dispense_status
        - last_synced_at
      properties:
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid }
        doctor_id: { type: string, format: uuid, nullable: true }
        visit_status: { type: string }
        prescription_status: { type: string }
        medicine_count: { type: integer }
        queued_at: { type: string, format: date-time }
        patient_name: { type: string, nullable: true }
        uhid: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        age_years: { type: integer, nullable: true }
        gender: { type: string, nullable: true }
        doctor_name: { type: string, nullable: true }
        formatted_visit_id: { type: string, nullable: true }
        dispense_status: { $ref: "#/components/schemas/PharmacyDispenseStatus" }
        last_synced_at: { type: string, format: date-time }
    PharmacyQueueResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PharmacyQueueItem" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    OpdPrescriptionMedicineLine:
      type: object
      required: [line_no, name]
      properties:
        line_no: { type: integer }
        medicine_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        strength: { type: string, nullable: true }
        dosage: { type: string, nullable: true }
        duration: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        quantity: { type: string, nullable: true }
        route: { type: string, nullable: true }
        catalog_unit_price: { type: string, nullable: true }
    OpdPrescriptionSnapshot:
      type: object
      required:
        - prescription_id
        - visit_id
        - patient_id
        - visit_status
        - prescription_status
        - medicines
      properties:
        prescription_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_status: { type: string }
        prescription_status: { type: string }
        doctor_id: { type: string, format: uuid, nullable: true }
        doctor_name: { type: string, nullable: true }
        finalized_at: { type: string, format: date-time, nullable: true }
        vitals_summary: { type: string, nullable: true }
        complaints_summary: { type: string, nullable: true }
        diagnosis_summary: { type: string, nullable: true }
        medicines:
          type: array
          items: { $ref: "#/components/schemas/OpdPrescriptionMedicineLine" }
    SaveDispenseLineInput:
      type: object
      required: [medicine_id, medicine_display_name, quantity_dispensed, unit_amount]
      properties:
        medicine_id: { type: string, format: uuid }
        medicine_display_name: { type: string }
        prescribed_quantity: { type: string, nullable: true }
        quantity_dispensed: { type: string }
        unit_amount: { type: string }
        line_discount:
          type: string
          nullable: true
          description: Line-level discount amount (₹); defaults to 0.
        tax_percent:
          type: string
          nullable: true
          description: Tax rate as percent (e.g. 12 for 12%); defaults to 0.
        inventory_item_id:
          type: string
          format: uuid
          nullable: true
          description: Inventory item-master id for FEFO stock deduction when quantity_dispensed > 0.
    SaveDispenseForVisitRequest:
      type: object
      required: [patient_id, lines]
      properties:
        patient_id: { type: string, format: uuid }
        opd_prescription_id: { type: string, format: uuid, nullable: true }
        inventory_store_id:
          type: string
          format: uuid
          nullable: true
          description: Pharmacy inventory store selected on the counter (required when issuing stock).
        discount:
          type: string
          nullable: true
          description: Bill-level discount amount; defaults to 0. total_amount = subtotal - discount.
        notes: { type: string, nullable: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SaveDispenseLineInput" }
    DispenseLineItem:
      type: object
      required:
        - id
        - medicine_display_name
        - quantity_dispensed
        - unit_amount
        - line_discount
        - tax_percent
        - tax_amount
        - line_total
      properties:
        id: { type: string, format: uuid }
        medicine_id: { type: string, format: uuid, nullable: true }
        medicine_display_name: { type: string }
        prescribed_quantity: { type: string, nullable: true }
        quantity_dispensed: { type: string }
        unit_amount: { type: string }
        line_discount: { type: string }
        tax_percent: { type: string }
        tax_amount: { type: string }
        line_total: { type: string }
        inventory_item_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    DispenseForVisitResponse:
      type: object
      required:
        - visit_id
        - patient_id
        - subtotal
        - discount
        - total_amount
        - has_dispense
        - dispense_status
        - lines
        - opd_prescription
        - dispensable_medicines
      properties:
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        opd_prescription_id: { type: string, format: uuid, nullable: true }
        subtotal:
          type: string
          description: Sum of line totals (after line discount and tax).
        discount:
          type: string
          description: Bill-level discount subtracted from subtotal.
        total_amount:
          type: string
          description: max(0, subtotal - discount).
        notes: { type: string, nullable: true }
        has_dispense: { type: boolean }
        dispense_status: { $ref: "#/components/schemas/PharmacyDispenseStatus" }
        record_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DispenseLineItem" }
        opd_prescription:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/OpdPrescriptionSnapshot" }]
        dispensable_medicines:
          type: array
          description: Prescription medicines that exist in the tenant master catalog (dispense table seed).
          items: { $ref: "#/components/schemas/OpdPrescriptionMedicineLine" }
        patient_name:
          type: string
          nullable: true
          description: Denormalized patient display name from pharmacy.queue_projection.
        uhid:
          type: string
          nullable: true
        age_years:
          type: integer
          nullable: true
        gender:
          type: string
          nullable: true
        formatted_visit_id:
          type: string
          nullable: true
          description: Human-readable visit number from registration (e.g. OP2606090000019).
    WalkInPatient:
      type: object
      required: [id, first_name, gender, created_at]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        gender: { type: string, enum: [male, female, other] }
        date_of_birth: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
    SaveWalkInPatientInput:
      type: object
      required: [first_name, gender]
      properties:
        first_name: { type: string }
        last_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        gender: { type: string, enum: [male, female, other] }
        date_of_birth: { type: string, format: date, nullable: true }
    SaveWalkInDispenseRequest:
      type: object
      required: [walk_in_patient, lines]
      properties:
        walk_in_patient: { $ref: "#/components/schemas/SaveWalkInPatientInput" }
        discount: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SaveDispenseLineInput" }
    WalkInDispenseResponse:
      type: object
      required:
        - record_id
        - walk_in_order
        - walk_in_patient
        - subtotal
        - discount
        - total_amount
        - has_dispense
        - dispense_status
        - created_at
        - lines
      properties:
        record_id: { type: string, format: uuid }
        walk_in_order: { type: boolean, enum: [true] }
        walk_in_patient: { $ref: "#/components/schemas/WalkInPatient" }
        subtotal: { type: string }
        discount: { type: string }
        total_amount: { type: string }
        notes: { type: string, nullable: true }
        has_dispense: { type: boolean }
        dispense_status: { $ref: "#/components/schemas/PharmacyDispenseStatus" }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DispenseLineItem" }
