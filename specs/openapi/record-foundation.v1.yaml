openapi: 3.1.0
info:
  title: Record Foundation API
  version: 1.0.0
  description: >
    Record Foundation API — care-context registry and immutable FHIR Document Bundle vault.
    Simplified CRUD service with 2 tables. Does NOT own clinical source data (operational
    modules), patient identity (EMPI), or ABDM artifacts (Integration Hub).
servers:
  - url: http://localhost:3006/api/record-foundation/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Care Contexts
    description: Discoverable health-record units.
  - name: Bundles
    description: FHIR Document Bundle storage.
paths:
  /care-contexts:
    get:
      operationId: listCareContexts
      summary: List care contexts for a patient
      tags: [Care Contexts]
      parameters:
        - { name: patient_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/CareContextStatus" } }
      responses:
        "200":
          description: Care context list.
          content:
            application/json:
              schema:
                type: object
                required: [data, total]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CareContext" }
                  total: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCareContext
      summary: Create a new care context
      tags: [Care Contexts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCareContextRequest" }
      responses:
        "201":
          description: Care context created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CareContext" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Duplicate care context.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /care-contexts/{id}:
    get:
      operationId: getCareContext
      summary: Fetch one care context
      tags: [Care Contexts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Care context found.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/CareContext" }
        "404": { $ref: "#/components/responses/NotFound" }
  /care-contexts/{careContextId}/bundles:
    get:
      operationId: listCareContextBundles
      summary: List bundles for a care context
      tags: [Bundles]
      parameters:
        - { name: careContextId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Bundle list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Bundle" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bundles/{id}:
    get:
      operationId: getBundle
      summary: Fetch a FHIR Document Bundle by id
      tags: [Bundles]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Bundle found.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Bundle" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: storeBundle
      summary: Store a FHIR Document Bundle against an existing care context
      tags: [Bundles]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreBundleRequest" }
      responses:
        "201":
          description: Bundle stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Bundle" }
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Principal is not authorized.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
  schemas:
    ProblemDetails:
      type: object
      description: RFC 7807 problem+json error envelope.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    CareContextStatus:
      type: string
      enum: [active, inactive, archived]
    SourceOrigin:
      type: string
      enum: [platform_module, legacy_system, external_abdm]
    SourceRecordType:
      type: string
      enum:
        - opd_visit
        - ipd_admission
        - lab_report
        - prescription
        - radiology_report
        - discharge_summary
        - immunisation_record
        - wellness_record
        - health_document
        - external_record
    CareContext:
      type: object
      required:
        - id
        - patient_id
        - source_origin
        - source_system_id
        - source_record_type
        - display
        - period_start
        - status
        - created_at
      properties:
        id: { type: string, format: uuid }
        iq_tenant_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        source_origin: { $ref: "#/components/schemas/SourceOrigin" }
        source_system_id: { type: string }
        source_record_type: { $ref: "#/components/schemas/SourceRecordType" }
        source_record_id: { type: string, nullable: true }
        encounter_id: { type: string, format: uuid, nullable: true }
        display: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/CareContextStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
    CreateCareContextRequest:
      type: object
      required:
        - patient_id
        - source_origin
        - source_system_id
        - source_record_type
        - display
        - period_start
      additionalProperties: false
      properties:
        patient_id: { type: string, format: uuid }
        source_origin: { $ref: "#/components/schemas/SourceOrigin" }
        source_system_id: { type: string }
        source_record_type: { $ref: "#/components/schemas/SourceRecordType" }
        source_record_id: { type: string }
        encounter_id: { type: string, format: uuid }
        display: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/CareContextStatus" }
    Bundle:
      type: object
      required:
        - id
        - care_context_id
        - bundle_kind
        - fhir_profile_url
        - fhir_profile_version
        - bundle_json
        - produced_at
      properties:
        id: { type: string, format: uuid }
        iq_tenant_id: { type: string, format: uuid }
        care_context_id: { type: string, format: uuid }
        bundle_kind: { type: string }
        fhir_profile_url: { type: string, format: uri }
        fhir_profile_version: { type: string }
        producer_kind: { type: string }
        producer_id: { type: string }
        bundle_json: { type: object, description: Full FHIR R4 Bundle JSON }
        bundle_size_bytes: { type: integer }
        produced_at: { type: string, format: date-time }
        stored_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
    StoreBundleRequest:
      type: object
      required:
        - care_context_id
        - bundle_kind
        - fhir_profile_url
        - fhir_profile_version
        - bundle_json
        - produced_at
      additionalProperties: false
      properties:
        care_context_id: { type: string, format: uuid }
        bundle_kind: { type: string }
        fhir_profile_url: { type: string, format: uri }
        fhir_profile_version: { type: string }
        producer_kind: { type: string }
        producer_id: { type: string }
        bundle_json: { type: object, description: Full FHIR R4 Bundle JSON }
        produced_at: { type: string, format: date-time }
