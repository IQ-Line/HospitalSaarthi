openapi: 3.1.0
info:
  title: EMPI — Enterprise Master Patient Index
  version: 1.0.0
  description: |
    Patient identity management: registration, search, demographics CRUD,
    ABHA/identifier linking, and address management.

servers:
  - url: http://localhost:3002/api/empi/v1
    description: Local development

paths:
  /patients:
    post:
      operationId: registerPatient
      summary: Register a new patient
      description: |
        Creates a patient with auto-generated UHID. Runs dedup check (Phase 2).
        If potential duplicate found, returns existing patient with `potential_duplicate: true`.
        Pass `force_create: true` in body to bypass dedup.
      tags: [Patients]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "409":
          description: Potential duplicate found (Phase 2)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateResponse"

    get:
      operationId: searchPatients
      summary: Search patients
      description: |
        Tenant-scoped lookup with **required** identity-style criteria (at least one of `uhid`,
        `phone`, `mobile`, `abha_number`, or `name` with ≥2 characters). Combine with `status`,
        `gender`, pagination (`page`, `limit` max 100), and `sort`/`order` for desk workflows.

        **Phone / mobile:** `phone` and `mobile` are equivalent for matching — both compare against
        stored `phone_number` **or** `alternate_phone` (exact string as stored).

        **Name:** case-insensitive substring on `full_name`; uses `pg_trgm` GIN when migration
        `0001_pg_trgm.sql` is applied.

        **Performance:** UHID and phone matches use btree indexes; name search uses trigram GIN.
      tags: [Patients]
      parameters:
        - name: name
          in: query
          schema:
            type: string
            minLength: 2
          description: Substring match on `full_name` (minimum 2 characters when used as the primary criterion).
        - name: phone
          in: query
          schema:
            type: string
          description: Exact match on `phone_number` or `alternate_phone` (same as `mobile`).
        - name: mobile
          in: query
          schema:
            type: string
          description: Alias of `phone` for registration-desk wording; first non-empty of `mobile`/`phone` wins if both are sent.
        - name: uhid
          in: query
          schema:
            type: string
          description: Exact match on UHID
        - name: abha_number
          in: query
          schema:
            type: string
          description: Exact match on ABHA number
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, deceased]
          description: Filter by patient status (optional; narrows other criteria).
        - name: gender
          in: query
          schema:
            type: string
            enum: [male, female, other]
          description: Optional filter on gender.
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, full_name]
            default: created_at
          description: Sort column for the result page.
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated patient list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSearchPage"
        "400":
          description: Missing or invalid search criteria (e.g. no keys, name too short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSearchError"

  /patients/{id}:
    get:
      operationId: getPatient
      summary: Get patient by ID
      description: Returns patient with addresses and identifiers.
      tags: [Patients]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      responses:
        "200":
          description: Patient detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientDetail"
        "404":
          description: Patient not found

    patch:
      operationId: updatePatient
      summary: Update patient demographics
      tags: [Patients]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found

  /patients/{id}/status:
    patch:
      operationId: changePatientStatus
      summary: Change patient status
      description: |
        Allowed transitions: active ↔ inactive; active or inactive → deceased.
        `deceased` is terminal (cannot return to active/inactive).
      tags: [Patients]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive, deceased]
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
        "409":
          description: Disallowed status transition (e.g. deceased → active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidStatusTransition"

  /patients/{id}/identifiers:
    post:
      operationId: linkIdentifier
      summary: Link an identifier to a patient
      tags: [Identifiers]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentifierRequest"
      responses:
        "201":
          description: Identifier linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientIdentifier"

  /patients/{id}/identifiers/{identifierId}:
    delete:
      operationId: deactivateIdentifier
      summary: Deactivate an identifier
      tags: [Identifiers]
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: identifierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Identifier deactivated
        "404":
          description: Identifier not found

  /patients/{id}/addresses:
    post:
      operationId: addAddress
      summary: Add an address to a patient
      tags: [Addresses]
      parameters:
        - $ref: "#/components/parameters/PatientId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "201":
          description: Address created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientAddress"

  /patients/{id}/addresses/{addressId}:
    patch:
      operationId: updateAddress
      summary: Update an address
      tags: [Addresses]
      parameters:
        - $ref: "#/components/parameters/PatientId"
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAddressRequest"
      responses:
        "200":
          description: Updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientAddress"
        "404":
          description: Address not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform access token; must include `iq_tenant_id` claim for tenant scoping.

  parameters:
    PatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Patient UUID

  schemas:
    InvalidStatusTransition:
      type: object
      required: [error, from, to]
      properties:
        error:
          type: string
          enum: [invalid_status_transition]
        from:
          type: string
          enum: [active, inactive, deceased]
        to:
          type: string
          enum: [active, inactive, deceased]

    PatientSearchPage:
      type: object
      required: [data, total, page, limit, total_pages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        total:
          type: integer
          description: Total rows matching the filter (all pages).
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total_pages:
          type: integer
          minimum: 0
          description: ceil(total / limit); 0 when total is 0.

    PatientSearchError:
      type: object
      required: [statusCode, error, message, code]
      properties:
        statusCode:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
        code:
          type: string
          enum: [patient_search_invalid_query]

    CreatePatientRequest:
      type: object
      required: [first_name, gender, phone_number]
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        salutation:
          type: string
          enum: [Mr, Mrs, Ms, Dr, Master, Baby]
        father_name:
          type: string
        mother_name:
          type: string
        date_of_birth:
          type: string
          format: date
        year_of_birth:
          type: integer
        age_years:
          type: integer
        age_months:
          type: integer
        age_days:
          type: integer
        gender:
          type: string
          enum: [male, female, other]
        phone_number:
          type: string
        alternate_phone:
          type: string
        blood_group:
          type: string
          enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"]
        occupation:
          type: string
        nationality:
          type: string
          default: Indian
        education:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_relationship:
          type: string
        emergency_contact_phone:
          type: string
        abha_number:
          type: string
        force_create:
          type: boolean
          description: Skip dedup check and create anyway
          default: false

    UpdatePatientRequest:
      type: object
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        salutation:
          type: string
        father_name:
          type: string
        mother_name:
          type: string
        date_of_birth:
          type: string
          format: date
        year_of_birth:
          type: integer
        age_years:
          type: integer
        gender:
          type: string
          enum: [male, female, other]
        phone_number:
          type: string
        alternate_phone:
          type: string
        blood_group:
          type: string
        occupation:
          type: string
        nationality:
          type: string
        education:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_relationship:
          type: string
        emergency_contact_phone:
          type: string
        abha_number:
          type: string

    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        uhid:
          type: string
        abha_number:
          type: string
          nullable: true
        salutation:
          type: string
          nullable: true
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        full_name:
          type: string
        gender:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        age_years:
          type: integer
          nullable: true
        phone_number:
          type: string
        status:
          type: string
          enum: [active, inactive, deceased]
        created_at:
          type: string
          format: date-time

    PatientDetail:
      type: object
      properties:
        patient:
          $ref: "#/components/schemas/Patient"
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/PatientAddress"
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/PatientIdentifier"

    DuplicateResponse:
      type: object
      properties:
        potential_duplicate:
          type: boolean
          const: true
        existing_patient:
          $ref: "#/components/schemas/Patient"
        match_details:
          type: object
          properties:
            matched_fields:
              type: array
              items:
                type: string

    CreateIdentifierRequest:
      type: object
      required: [identifier_type, identifier_value]
      properties:
        identifier_type:
          type: string
          enum: [abha_address, phr_address, legacy_mrn, insurance_id, other]
        identifier_value:
          type: string
        issuing_system:
          type: string

    PatientIdentifier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        identifier_type:
          type: string
        identifier_value:
          type: string
        issuing_system:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateAddressRequest:
      type: object
      required: [address_type]
      properties:
        address_type:
          type: string
          enum: [permanent, current, temporary]
        street:
          type: string
        city:
          type: string
        district:
          type: string
        state:
          type: string
        pincode:
          type: string

    UpdateAddressRequest:
      type: object
      properties:
        address_type:
          type: string
          enum: [permanent, current, temporary]
        street:
          type: string
        city:
          type: string
        district:
          type: string
        state:
          type: string
        pincode:
          type: string

    PatientAddress:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        address_type:
          type: string
        street:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        pincode:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
