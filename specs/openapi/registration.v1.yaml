openapi: 3.1.0
info:
  title: Registration — Patient snapshot & encounter visits
  version: 1.0.0
  description: |
    **ADR-0029:** Registration module persists two tenant-scoped tables:

    - **`registration`** — one row per patient per tenant: a frozen EMPI demographics snapshot
      (`patient_source_record_id` points to EMPI for audit/lineage). List/get/search are **EMPI-free**
      via snapshot columns (`patient_full_name`, `patient_phone_number`, `patient_uhid`).
    - **`visit`** — one row per desk encounter (OPD/IPD intake): facility, department, doctor,
      appointment, visit type, and **visit `status`** (`pending`, `in_progress`, `completed`, `cancelled`).

    Workflow POSTs return a **merged `Registration` view** (snapshot + current visit overlay).
    Pure `GET /registrations` rows expose snapshot fields only; encounter fields are null and
    `registration_status` is a placeholder — use **Visits** APIs for encounter state.

    **Workflows:**
    - *Existing patient:* `POST /workflows/existing-patient/registrations` — caller supplies
      `patient_id` only (optional encounter fields). Server creates a visit; no EMPI round trip.
    - *New patient:* `POST /workflows/new-patient/registrations` — Registration calls EMPI once,
      inserts the snapshot row, then creates the visit.

    **Completing intake:** `POST /visits/{visitId}/complete` after appointment and billing succeed
    (replaces legacy `POST /registrations/{id}/complete`).

tags:
  - name: EncounterRegistrations
    description: Patient snapshot rows — list and get registrations (no encounter fields).
  - name: Visits
    description: Encounter (visit) CRUD, status transitions, and intake completion.
  - name: ExistingPatientIntake
    description: Open a visit for a patient already known to EMPI / registration.
  - name: NewPatientIntake
    description: Register demographics (via EMPI) plus encounter visit in one desk action.

servers:
  - url: http://localhost:3006/api/registration/v1
    description: Local registration-svc (REGISTRATION_SVC_PORT; default 3006)

paths:
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      summary: Dashboard visit metrics (tenant-scoped)
      description: |
        Returns visit counters, patient footfall for the last `days` calendar days (IST, default 3),
        and today's visits (each row includes `visit_id` and linked `registration_id`).
        `doctor_pending_consultations` is always `0` until OPD queue is wired.
        New vs follow-up counts use `visit_type` codes `opd_first` and `opd_follow_up` only.
      tags: [EncounterRegistrations]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 3, maximum: 30, default: 3 }
          description: Footfall window length in days (inclusive of today).
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /visit-type-decision:
    post:
      operationId: getVisitTypeDecision
      summary: Resolve OPD visit type before registration submit
      description: |
        Advisory endpoint for the registration desk. Resolves the patient (local snapshot or EMPI),
        loads tenant free follow-up policy from Configurator, and returns the visit type code,
        consultation fee (0 or 1), and whether the UI should lock the visit-type dropdown.

        Decision uses **patient + department only** (doctor does not affect visit type).
      tags: [EncounterRegistrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitTypeDecisionRequest"
      responses:
        "200":
          description: Visit type decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitTypeDecisionResponse"
        "400":
          description: Invalid request body
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /registrations:
    get:
      operationId: listRegistrations
      summary: List patient registrations (paginated, local snapshot search)
      description: |
        Tenant-scoped snapshot rows newest first. **No EMPI calls** — search uses snapshot columns
        (`patient_full_name`, `patient_phone_number`, `patient_uhid`).

        Free-text `q` matches UHID, phone, or full name (substring, case-insensitive).

        **Search param precedence:** use `q` *or* legacy `uhid` / `mobile` / `name` — not both;
        sending `q` together with any legacy alias returns `400` (`registration_list_search_conflict`).
        Legacy `name` alone requires ≥2 characters.

        Defaults: `page=1`, `limit=10` (max `limit` 100). Response rows are snapshot-only
        (encounter fields null); filter encounters via `GET /visits`.
      tags: [EncounterRegistrations]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: q
          in: query
          schema: { type: string }
          description: Free-text against snapshot uhid / phone / full name.
        - name: uhid
          in: query
          schema: { type: string }
          description: Alias for UHID substring match (same as `q` when only uhid set).
        - name: mobile
          in: query
          schema: { type: string }
          description: Alias for phone substring match.
        - name: name
          in: query
          schema: { type: string, minLength: 2 }
          description: Substring on `patient_full_name` (minimum 2 characters when used).
        - name: patient_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paginated registration list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationListPage"
        "400":
          description: Invalid query (conflicting search params or name shorter than 2 characters)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /registrations/{registrationId}:
    get:
      operationId: getRegistration
      summary: Get patient registration snapshot by id
      tags: [EncounterRegistrations]
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Registration snapshot row (encounter fields null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /registrations/{registrationId}/documents/opd-slip.pdf:
    get:
      operationId: getRegistrationOpdSlipPdf
      summary: OPD slip PDF for a registration
      description: |
        Returns a PDF generated server-side for desk preview and print once the registration row exists
        (`pending`, `in_progress`, or `completed` visit). Cancelled visits return 409.

        Staff callers use Bearer JWT plus tenant headers. External integrations (e.g. Smart Report) may
        call with `X-API-Key` (tenant-scoped key with purpose `opd_slip` from Configurator) instead of JWT.
      tags: [EncounterRegistrations]
      security:
        - bearerAuth: []
        - opdSlipApiKey: []
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "401":
          description: Missing or invalid credentials (JWT or API key)
        "200":
          description: OPD slip PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Registration not found
        "409":
          description: Visit not in a printable state
        "503":
          description: PDF renderer unavailable

  /documents/opd-slip.pdf:
    post:
      operationId: renderPartnerOpdSlipPdf
      summary: Generate OPD slip PDF from partner payload
      description: |
        External integrations (e.g. Smart Report) send visit/patient/doctor/facility details in the
        request body and receive a PDF. No registration row lookup is performed.

        Requires `X-API-Key` (tenant-scoped key with purpose `opd_slip` from Configurator).
        Include `smartParchaPages` when Smart Parcha canvas images are available.
      tags: [EncounterRegistrations]
      security:
        - opdSlipApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerOpdSlipRequest"
      responses:
        "200":
          description: OPD slip PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid API key
        "503":
          description: PDF renderer unavailable

  /visits:
    get:
      operationId: listVisits
      summary: List visits (paginated)
      description: |
        Tenant-scoped encounter rows newest first. Filter by `status`, `patient_id`,
        `facility_id`, `department_id`, `doctor_id`, or inclusive `updated_from` /
        `updated_to` calendar dates on `updated_at`.

        Defaults: `page=1`, `limit=20` (max `limit` 100).
      tags: [Visits]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/VisitStatus" }
        - name: patient_id
          in: query
          schema: { type: string, format: uuid }
        - name: facility_id
          in: query
          schema: { type: string, format: uuid }
        - name: department_id
          in: query
          schema: { type: string, format: uuid }
        - name: doctor_id
          in: query
          schema: { type: string, format: uuid }
        - name: updated_from
          in: query
          schema: { type: string, format: date }
          description: Inclusive lower bound on visit `updated_at` (calendar date).
        - name: updated_to
          in: query
          schema: { type: string, format: date }
          description: Inclusive upper bound on visit `updated_at` (calendar date).
      responses:
        "200":
          description: Paginated visit list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitListPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createVisit
      summary: Create a visit for an existing patient
      description: |
        Inserts an encounter row for `patient_id`. Requires `Idempotency-Key`; same key + tenant
        returns the original visit (200).
      tags: [Visits]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVisitRequest"
      responses:
        "200":
          description: Idempotent replay — existing visit returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "201":
          description: Visit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "400":
          description: Invalid body or missing Idempotency-Key
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /visits/{visitId}:
    get:
      operationId: getVisit
      summary: Get visit by id
      tags: [Visits]
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: Visit row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    patch:
      operationId: updateVisit
      summary: Update visit encounter fields
      tags: [Visits]
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisitRequest"
      responses:
        "200":
          description: Visit updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      operationId: deleteVisit
      summary: Delete visit
      tags: [Visits]
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "204":
          description: Visit deleted
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /visits/{visitId}/status:
    post:
      operationId: updateVisitStatus
      summary: Set visit status explicitly
      tags: [Visits]
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVisitStatusRequest"
      responses:
        "200":
          description: Visit status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visit"
        "400":
          description: Invalid status (`invalid_visit_status`)
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /visits/{visitId}/complete:
    post:
      operationId: completeVisitIntake
      summary: Mark visit completed (full desk intake done)
      description: |
        Sets visit `status` to `completed` after appointment and billing succeed.
        Returns merged `Registration` (snapshot + visit overlay).
      tags: [Visits]
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: Visit marked completed; merged registration view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workflows/existing-patient/registrations:
    post:
      operationId: createVisitForExistingPatient
      summary: Existing-patient visit (workflow)
      description: |
        Caller supplies `patient_id` (patient already registered). Registration creates a visit row
        and returns merged snapshot + encounter fields — **no EMPI round trip** on this path.
      tags: [ExistingPatientIntake]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExistingPatientVisitRequest"
      responses:
        "200":
          description: Idempotent replay — merged registration view returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "201":
          description: Visit created — merged registration view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Invalid body or missing Idempotency-Key
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workflows/new-patient/registrations:
    post:
      operationId: createRegistrationForNewPatient
      summary: New-patient registration + visit (EMPI saga)
      description: |
        Creates patient in EMPI (forwards `Idempotency-Key`), inserts the registration snapshot row
        from EMPI's response, then creates the visit.

        Returns `503` (`empi_gateway_not_configured`) when EMPI is not wired.
        Returns `409` (`patient_already_exists`) when EMPI reports a duplicate — use
        existing-patient flow with the returned `patient_id`.
      tags: [NewPatientIntake]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPatientIntakeRequest"
      responses:
        "200":
          description: Idempotent replay — merged registration view returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "201":
          description: Registration and visit created — merged view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Invalid body or missing Idempotency-Key
        "409":
          description: Patient already exists in EMPI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePatientResponse"
        "503":
          description: EMPI unavailable or gateway not configured
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /workflows/opd-registrations/complete:
    post:
      operationId: completeOpdRegistration
      summary: Unified OPD registration (intake + billing + complete)
      description: |
        Partner / integration endpoint that orchestrates the full OPD desk flow in one call:

        1. New-patient registration + visit (`POST /workflows/new-patient/registrations` equivalent)
        2. Billing charges (registration fee and/or consultation fee from tariff item codes)
        3. Optional invoice discount, bill finalize, and payment
        4. Visit intake completion (`POST /visits/{visitId}/complete` equivalent)

        The browser registration desk continues to use the individual endpoints; this route is
        additive and does not replace them.

        Requires `Idempotency-Key`. Billing sub-steps reuse suffixed keys (`:reg-fee`, `:consult`,
        `:payment`) matching the desk flow.
      tags: [NewPatientIntake]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpdRegistrationCompleteRequest"
      responses:
        "200":
          description: Idempotent replay — registration completed with billing summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpdRegistrationCompleteResponse"
        "201":
          description: Full OPD registration completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpdRegistrationCompleteResponse"
        "400":
          description: Invalid body, missing Idempotency-Key, or billing validation error
        "409":
          description: Patient already exists in EMPI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePatientResponse"
        "502":
          description: Upstream EMPI error
        "503":
          description: EMPI or billing gateway unavailable
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    opdSlipApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Tenant API key with purpose `opd_slip` (Configurator). Required for `POST /documents/opd-slip.pdf`; alternative to Bearer JWT on `GET .../opd-slip.pdf`.
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: >
        Client-generated key for retry-safe creates. Same key + tenant returns the original row (200).
    IdempotencyKeyHeaderOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Principal is not authorized for this resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { type: string }
        code: { type: string }

    PartnerOpdSlipRequest:
      type: object
      additionalProperties: false
      required: [patientId, visitId, patient, visit, doctor, facility]
      properties:
        patientId: { type: string, minLength: 1 }
        visitId: { type: string, minLength: 1 }
        doctorId: { type: string, minLength: 1 }
        patient:
          type: object
          additionalProperties: false
          required: [name, uhid]
          properties:
            name: { type: string, minLength: 1 }
            uhid: { type: string, minLength: 1 }
            phoneNumber: { type: string }
            dateOfBirth: { type: string }
            yearOfBirth: { type: integer }
            gender: { type: string }
            salutation: { type: string }
            abhaNumber: { type: string }
            abhaAddress: { type: string }
            address: { type: string }
        visit:
          type: object
          additionalProperties: false
          required: [createdAt]
          properties:
            visitNumber: { type: string }
            createdAt: { type: string, minLength: 1 }
            visitType: { type: string }
            status: { type: string }
            departmentName: { type: string }
            roomNumber: { type: string }
            tokenNumber: { type: integer }
            fees: { type: string }
            visitValidTill: { type: string }
            consultationType: { type: string }
            priority: { type: string }
        doctor:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            qualification: { type: string }
            specialization: { type: string }
            hprId: { type: string }
            regNumber: { type: string }
            signature: { type: string }
        facility:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            address: { type: string }
            phone: { type: string }
            email: { type: string }
            facilityId: { type: string }
            logoUrl: { type: string }
            footerText: { type: string }
        smartParchaEnabled: { type: boolean }
        smartParchaPages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [pageNumber, content]
            properties:
              pageNumber: { type: integer, minimum: 1 }
              content: { type: string, minLength: 1 }
        showDoctorSignature: { type: boolean }
        options:
          type: object
          additionalProperties: false
          properties:
            landscape: { type: boolean }
            format: { type: string, enum: [A4, Letter] }
            marginTop: { type: string, maxLength: 32 }
            marginBottom: { type: string, maxLength: 32 }
            marginLeft: { type: string, maxLength: 32 }
            marginRight: { type: string, maxLength: 32 }

    VisitStatus:
      type: string
      enum: [pending, in_progress, completed, cancelled]
      default: pending
      description: Encounter lifecycle on `registration.visit.status`.

    DuplicatePatientResponse:
      type: object
      required: [code, message, patient_id, patient_snapshot]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [patient_already_exists]
        message: { type: string }
        patient_id:
          type: string
          format: uuid
        patient_snapshot:
          $ref: "#/components/schemas/PatientSnapshot"

    IntakeCompletion:
      type: string
      enum: [pending, partial, complete]
      description: |
        Desk visit-intake progress at create time. `partial` → visit `in_progress`;
        `complete` → visit `completed`; omitted defaults to `partial` on workflow POSTs and `POST /visits`.

    PatientSnapshot:
      type: object
      required: [uhid, full_name, phone_number]
      additionalProperties: false
      description: Demographics shape returned from EMPI (request/duplicate responses).
      properties:
        uhid: { type: string }
        abha_number: { type: string, nullable: true }
        abha_address: { type: string, nullable: true }
        full_name: { type: string }
        phone_number: { type: string }
        gender: { type: string, nullable: true }
        date_of_birth: { type: string, format: date, nullable: true }
        year_of_birth: { type: integer, nullable: true }

    RegistrationSnapshot:
      type: object
      required:
        - patient_id
        - patient_uhid
        - patient_full_name
        - patient_phone_number
        - patient_source_record_id
      additionalProperties: false
      description: |
        Frozen patient demographics persisted on `registration.registration`
        (EMPI-free for list/get/search).
      properties:
        patient_id: { type: string, format: uuid }
        patient_uhid: { type: string }
        patient_abha_number: { type: string, nullable: true }
        patient_abha_address: { type: string, nullable: true }
        patient_full_name: { type: string }
        patient_phone_number: { type: string }
        patient_gender: { type: string, nullable: true }
        patient_date_of_birth: { type: string, format: date, nullable: true }
        patient_year_of_birth: { type: integer, nullable: true }
        patient_source_record_id:
          type: string
          format: uuid
          description: Soft-ref to empi.patient_source_records.id

    VisitEncounterFields:
      type: object
      additionalProperties: false
      properties:
        facility_id: { type: string, format: uuid, nullable: true }
        visit_type:
          type: string
          description: Master Data visit_types picklist code (e.g. `opd_first`, `opd_free_follow_up`).
        consultation_type:
          type: string
          enum: [new, followup, free-followup]
          description: Derived consultation category; server validates on free follow-up create.
        department_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        intake_completion:
          $ref: "#/components/schemas/IntakeCompletion"

    VisitTypeDecisionPatient:
      type: object
      additionalProperties: false
      properties:
        patient_id: { type: string, format: uuid }
        uhid: { type: string }
        abha_number: { type: string }
        abha_address: { type: string }
        phone_number: { type: string }
        first_name: { type: string }
        middle_name: { type: string }
        last_name: { type: string }
        gender:
          type: string
          enum: [male, female, other]
        date_of_birth: { type: string }
        age_years: { type: integer }
        age_months: { type: integer }
        age_days: { type: integer }

    VisitTypeDecisionRequest:
      type: object
      required: [department_id]
      additionalProperties: false
      properties:
        department_id:
          type: string
          format: uuid
        patient:
          $ref: "#/components/schemas/VisitTypeDecisionPatient"

    VisitTypeDecisionResult:
      type: object
      required:
        - consultation_type
        - visit_type_code
        - fee
        - is_locked
        - resolved_patient_id
        - free_follow_up_visit_count
        - free_follow_up_visits_allowed
        - free_follow_up_visits_remaining
        - valid_till
      additionalProperties: false
      properties:
        consultation_type:
          type: string
          enum: [new, followup, free-followup]
        visit_type_code:
          type: string
          description: Picklist code to set on the registration form.
        fee:
          type: integer
          enum: [0, 1]
          description: Consultation fee in rupees (0 = free follow-up).
        is_locked:
          type: boolean
        resolved_patient_id:
          type: string
          format: uuid
          nullable: true
        free_follow_up_visit_count: { type: integer, minimum: 0 }
        free_follow_up_visits_allowed: { type: integer, minimum: 0 }
        free_follow_up_visits_remaining: { type: integer, minimum: 0 }
        valid_till:
          type: string
          format: date-time
          nullable: true

    VisitTypeDecisionResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/VisitTypeDecisionResult"

    ExistingPatientVisitRequest:
      type: object
      required: [patient_id]
      additionalProperties: false
      properties:
        patient_id:
          type: string
          format: uuid
        facility_id: { type: string, format: uuid, nullable: true }
        visit_type: { type: string }
        department_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        intake_completion:
          $ref: "#/components/schemas/IntakeCompletion"

    CreateVisitRequest:
      type: object
      required: [patient_id]
      additionalProperties: false
      properties:
        patient_id:
          type: string
          format: uuid
        facility_id: { type: string, format: uuid, nullable: true }
        visit_type: { type: string }
        department_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        intake_completion:
          $ref: "#/components/schemas/IntakeCompletion"

    UpdateVisitRequest:
      type: object
      additionalProperties: false
      properties:
        visit_type: { type: string }
        facility_id: { type: string, format: uuid, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }

    UpdateVisitStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/VisitStatus"

    CreatePatientDemographicsRequest:
      type: object
      description: Same shape as EMPI `CreatePatientRequest` (specs/openapi/empi.v1.yaml).
      required: [first_name, gender, phone_number]
      additionalProperties: false
      properties:
        first_name: { type: string }
        middle_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        salutation: { type: string }
        father_name: { type: string }
        mother_name: { type: string }
        date_of_birth: { type: string, format: date }
        year_of_birth: { type: integer }
        gender:
          type: string
          enum: [male, female, other]
        phone_number: { type: string }
        alternate_phone: { type: string }
        blood_group: { type: string }
        occupation: { type: string }
        nationality: { type: string, default: Indian }
        education: { type: string }
        emergency_contact_name: { type: string }
        emergency_contact_relationship: { type: string }
        emergency_contact_phone: { type: string }
        abha_number: { type: string }
        abha_address: { type: string }
        force_create: { type: boolean, default: false }

    NewPatientIntakeRequest:
      type: object
      required: [patient]
      additionalProperties: false
      properties:
        patient:
          $ref: "#/components/schemas/CreatePatientDemographicsRequest"
        facility_id: { type: string, format: uuid, nullable: true }
        visit_type: { type: string }
        department_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        intake_completion:
          $ref: "#/components/schemas/IntakeCompletion"

    OpdRegistrationBillingFeeLine:
      type: object
      additionalProperties: false
      properties:
        item_code: { type: string, description: Tariff service code (e.g. Reg_01) }
        line_discount_percentage: { type: number, minimum: 0, maximum: 100 }

    OpdRegistrationBillingRequest:
      type: object
      additionalProperties: false
      properties:
        registration_fee:
          $ref: "#/components/schemas/OpdRegistrationBillingFeeLine"
        consultation_fee:
          $ref: "#/components/schemas/OpdRegistrationBillingFeeLine"
        department_name:
          type: string
          description: Display department name for consultation charge line (optional)
        invoice_discount: { type: number, minimum: 0 }
        amount_paid: { type: number, minimum: 0 }
        payment_method:
          type: string
          enum: [CASH, CARD, UPI, CHEQUE, BANK_TRANSFER]
        payment_notes: { type: string }

    OpdRegistrationCompleteRequest:
      allOf:
        - $ref: "#/components/schemas/NewPatientIntakeRequest"
        - type: object
          additionalProperties: false
          properties:
            billing:
              $ref: "#/components/schemas/OpdRegistrationBillingRequest"
            consultation_type:
              type: string
              enum: [new, followup, free-followup]

    OpdRegistrationCompleteResponse:
      allOf:
        - $ref: "#/components/schemas/Registration"
        - type: object
          required: [bill_id]
          additionalProperties: false
          properties:
            bill_id:
              type: string
              format: uuid
              nullable: true
              description: Billing bill id when charges were captured; null when no tariff lines sent

    Visit:
      type: object
      required:
        - visit_id
        - iq_tenant_id
        - patient_id
        - status
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        visit_id: { type: string, format: uuid }
        iq_tenant_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_type: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/VisitStatus"
        facility_id: { type: string, format: uuid, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VisitListPage:
      type: object
      required: [data, total, page, limit, total_pages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Visit"
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total_pages: { type: integer, minimum: 0 }

    RegistrationListPage:
      type: object
      required: [data, total, page, limit, total_pages]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Registration"
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total_pages: { type: integer, minimum: 0 }

    DashboardStatsResponse:
      type: object
      required: [stats, patient_footfall, todays_visits]
      properties:
        stats:
          type: object
          required:
            - total_visits
            - new_patient_registrations
            - follow_up_patient_registrations
            - doctor_pending_consultations
          properties:
            total_visits: { type: integer, minimum: 0 }
            new_patient_registrations: { type: integer, minimum: 0 }
            follow_up_patient_registrations: { type: integer, minimum: 0 }
            doctor_pending_consultations: { type: integer, minimum: 0 }
        patient_footfall:
          type: array
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer, minimum: 0 }
        todays_visits:
          type: array
          items:
            type: object
            required: [visit_id, registration_id, patient_name, time, status]
            properties:
              visit_id: { type: string, format: uuid }
              registration_id: { type: string, format: uuid }
              patient_name: { type: string }
              time: { type: string, description: "HH:mm (UTC) from visit created_at" }
              status:
                type: string
                enum: [completed, pending, in_progress]

    Registration:
      type: object
      description: |
        API view combining `RegistrationSnapshot` with optional visit overlay.
        List/get return snapshot fields; encounter fields and `registration_status` reflect
        the linked visit on workflow and `POST /visits/{visitId}/complete` responses.
      required:
        - registration_id
        - iq_tenant_id
        - patient_id
        - patient_uhid
        - patient_full_name
        - patient_phone_number
        - patient_source_record_id
        - registration_status
        - created_at
        - updated_at
      properties:
        registration_id: { type: string, format: uuid }
        iq_tenant_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid, nullable: true }
        patient_id: { type: string, format: uuid }
        patient_uhid: { type: string }
        patient_abha_number: { type: string, nullable: true }
        patient_abha_address: { type: string, nullable: true }
        patient_full_name: { type: string }
        patient_phone_number: { type: string }
        patient_gender: { type: string, nullable: true }
        patient_date_of_birth: { type: string, format: date, nullable: true }
        patient_year_of_birth: { type: integer, nullable: true }
        patient_source_record_id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid, nullable: true }
        visit_type: { type: string, nullable: true }
        visit_type_label:
          type: string
          nullable: true
          description: Display label from Master Data visit-types picklist.
        department_id: { type: string, format: uuid, nullable: true }
        doctor_id: { type: string, format: uuid, nullable: true }
        appointment_id: { type: string, format: uuid, nullable: true }
        registration_status:
          $ref: "#/components/schemas/VisitStatus"
          description: Mirrors visit `status` when overlay is present; placeholder on snapshot-only rows.
        registration_status_label:
          type: string
          nullable: true
          description: Display label from Master Data registration-status picklist.
        created_by: { type: string, format: uuid, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
