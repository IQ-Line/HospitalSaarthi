openapi: 3.1.0
info:
  title: Registration — Encounter intake (OPD / IPD / shared)
  version: 1.0.0
  description: |
    **Scope:** tenant-scoped encounter registration rows (patient + visit context). IDs reference
    other modules by contract only — no cross-schema foreign keys.

    **New vs existing patient (workflows):**
    - *New patient:* `POST /workflows/new-patient/registrations` accepts demographics plus visit fields,
      creates the patient via an injected **EMPI** gateway, then persists the encounter registration row.
      When the gateway is not configured, this operation returns `503` (deployment must supply
      `EmpiPatientsPort`).
    - *Existing patient:* `POST /workflows/existing-patient/registrations` or `POST /registrations`
      with a known `patient_id` (from EMPI search / prior registration).

    **Patient demographics (create/update):** owned by **EMPI** — `POST /api/empi/v1/patients`,
    `PATCH /api/empi/v1/patients/{id}` (`specs/openapi/empi.v1.yaml`). The new-patient workflow
    embeds the same create payload shape here for a single desk call when orchestration is enabled.

tags:
  - name: EncounterRegistrations
    description: Raw encounter row CRUD (patient_id must already exist unless using new-patient workflow).
  - name: ExistingPatientIntake
    description: Register a visit for a patient already known to EMPI.
  - name: NewPatientIntake
    description: Register demographics (via EMPI) plus encounter row in one request when EMPI gateway is configured.
  - name: PatientDemographics
    description: |
      Demographic persistence is implemented in **EMPI**, not this service. Use EMPI for standalone
      demographic edits and for search before existing-patient intake.

servers:
  - url: http://localhost:3004/api/registration/v1
    description: Local registration-svc

paths:
  /registrations:
    post:
      operationId: createRegistration
      summary: Create a registration row
      description: Lowest-level create when `patient_id` is already resolved (typically from EMPI).
      tags: [EncounterRegistrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistrationRequest"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Invalid body

  /registrations/{registrationId}:
    get:
      operationId: getRegistration
      summary: Get registration by id
      tags: [EncounterRegistrations]
      parameters:
        - $ref: "#/components/parameters/RegistrationId"
      responses:
        "200":
          description: Registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          description: Not found

  /workflows/existing-patient/registrations:
    post:
      operationId: createRegistrationForExistingPatient
      summary: Existing-patient visit registration
      description: Same contract as `POST /registrations`; intent-specific URL for desk workflows.
      tags: [ExistingPatientIntake, EncounterRegistrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistrationRequest"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Invalid body

  /workflows/new-patient/registrations:
    post:
      operationId: createRegistrationForNewPatient
      summary: New-patient visit registration (orchestrated)
      description: |
        Creates patient in EMPI via service-injected gateway, then creates the encounter registration.
        Returns `503` with code `empi_gateway_not_configured` when the deployment has not wired EMPI.
      tags: [NewPatientIntake, PatientDemographics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPatientIntakeRequest"
      responses:
        "201":
          description: Registration created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "400":
          description: Invalid body
        "503":
          description: EMPI patient gateway not configured on this service instance

components:
  parameters:
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateRegistrationRequest:
      type: object
      required: [patient_id]
      additionalProperties: false
      properties:
        patient_id:
          type: string
          format: uuid
          description: EMPI patient id (same tenant)
        visit_id:
          type: string
          format: uuid
          nullable: true
        facility_id:
          type: string
          format: uuid
          nullable: true
        visit_type:
          type: string
          description: e.g. opd_first, follow_up, emergency — codes from master data when wired
        department_id:
          type: string
          format: uuid
          nullable: true
        provider_id:
          type: string
          format: uuid
          nullable: true
        appointment_id:
          type: string
          format: uuid
          nullable: true
        registration_status:
          type: string
          default: pending

    CreatePatientDemographicsRequest:
      type: object
      description: |
        Same required fields and shape as EMPI `CreatePatientRequest` — persisted in EMPI only.
      required: [first_name, gender, phone_number]
      additionalProperties: false
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        salutation:
          type: string
          enum: [Mr, Mrs, Ms, Dr, Master, Baby]
        father_name:
          type: string
        mother_name:
          type: string
        date_of_birth:
          type: string
          format: date
        year_of_birth:
          type: integer
        age_years:
          type: integer
        age_months:
          type: integer
        age_days:
          type: integer
        gender:
          type: string
          enum: [male, female, other]
        phone_number:
          type: string
        alternate_phone:
          type: string
        blood_group:
          type: string
          enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"]
        occupation:
          type: string
        nationality:
          type: string
          default: Indian
        education:
          type: string
        emergency_contact_name:
          type: string
        emergency_contact_relationship:
          type: string
        emergency_contact_phone:
          type: string
        abha_number:
          type: string
        force_create:
          type: boolean
          description: Skip dedup check and create anyway
          default: false

    NewPatientIntakeRequest:
      type: object
      required: [patient]
      additionalProperties: false
      properties:
        patient:
          $ref: "#/components/schemas/CreatePatientDemographicsRequest"
        visit_id:
          type: string
          format: uuid
          nullable: true
        facility_id:
          type: string
          format: uuid
          nullable: true
        visit_type:
          type: string
          nullable: true
        department_id:
          type: string
          format: uuid
          nullable: true
        provider_id:
          type: string
          format: uuid
          nullable: true
        appointment_id:
          type: string
          format: uuid
          nullable: true
        registration_status:
          type: string
          default: pending
        created_by:
          type: string
          format: uuid
          nullable: true

    Registration:
      type: object
      required:
        - registration_id
        - iq_tenant_id
        - patient_id
        - registration_status
        - created_at
        - updated_at
      properties:
        registration_id:
          type: string
          format: uuid
        iq_tenant_id:
          type: string
          format: uuid
        visit_id:
          type: string
          format: uuid
          nullable: true
        patient_id:
          type: string
          format: uuid
        facility_id:
          type: string
          format: uuid
          nullable: true
        visit_type:
          type: string
          nullable: true
        department_id:
          type: string
          format: uuid
          nullable: true
        provider_id:
          type: string
          format: uuid
          nullable: true
        appointment_id:
          type: string
          format: uuid
          nullable: true
        registration_status:
          type: string
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
