openapi: 3.1.0
info:
  title: HIMS User Management API
  version: 1.0.0
paths:
  /auth/token: {}
  /auth/me:
    get:
      summary: Get current authenticated user
      description: >
        Returns the tenant-scoped platform user for the authenticated session (JWT `sub`
        resolved against the `users` table). This is profile data only — not the enriched
        authorization principal; use GET /auth/principal for that.
      responses:
        "200":
          description: Current user for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /auth/principal:
    get:
      summary: Get enriched principal for authorization
      description: >
        Returns the fully enriched principal used for authorization,
        combining JWT claims with resolved authorization data.
      responses:
        "200":
          description: Enriched principal (JWT claims plus resolved authorization data; token not included).
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - roles
                  - attributes
                properties:
                  id:
                    type: string
                  roles:
                    type: array
                    items:
                      type: string
                  attributes:
                    type: object
                    required:
                      - iq_tenant_id
                      - department
                      - org_id
                      - capabilities
                      - delegated_capabilities
                      - clearances
                    properties:
                      iq_tenant_id:
                        type: string
                      department:
                        type: string
                        nullable: true
                      org_id:
                        type: string
                        nullable: true
                      capabilities:
                        type: array
                        items:
                          type: string
                      delegated_capabilities:
                        type: array
                        items:
                          type: string
                      clearances:
                        type: object
                        additionalProperties:
                          type: string
                        description: Map of clearance types to levels (e.g. psychiatric, vip).
  /users:
    post:
      summary: Create a tenant-scoped platform user record
      description: >
        Creates a row in the platform `users` table for the current tenant (`iq_tenant_id`
        is the Citus distribution key and is taken from request context, not the request body).
        Credential storage and synthetic identity anchors remain in better-auth (`ba_*`) and
        are out of scope for this request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - full_name
              properties:
                full_name:
                  type: string
                  minLength: 1
                  description: Display name for the principal (required platform profile field).
                email:
                  type: string
                  nullable: true
                  description: Business contact email (nullable, non-unique per tenant); not the better-auth synthetic anchor.
                phone:
                  type: string
                  nullable: true
                  description: Business contact phone.
      responses:
        "201":
          description: Platform user created for the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input (e.g. malformed body or invalid field values).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /users/{id}:
    get:
      summary: Get a tenant-scoped user by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Platform user id within the current tenant.
      responses:
        "200":
          description: User found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found for this tenant.
    patch:
      summary: Update a tenant-scoped user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Platform user id within the current tenant.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                full_name:
                  type: string
                  minLength: 1
                  description: Display name for the principal.
                email:
                  type: string
                  nullable: true
                  description: Business contact email (nullable, non-unique per tenant); not the better-auth synthetic anchor.
                phone:
                  type: string
                  nullable: true
                  description: Business contact phone.
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input (e.g. malformed body or invalid field values).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: User not found for this tenant.
  /role-assignments:
    post:
      summary: Assign a role to a user
      description: >
        Creates a row in `role_assignments` for the current tenant. `iq_tenant_id` is taken
        from request context, not the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - user_id
                - role_id
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: Platform user id within the current tenant.
                role_id:
                  type: string
                  format: uuid
                  description: Role id within the current tenant.
      responses:
        "201":
          description: Role assignment created.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - user_id
                  - role_id
                properties:
                  id:
                    type: string
                    format: uuid
                  user_id:
                    type: string
                    format: uuid
                  role_id:
                    type: string
                    format: uuid
        "400":
          description: Malformed request (e.g. invalid JSON, missing required fields, or invalid UUID format).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: User or role not found for this tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "409":
          description: Duplicate role assignment (user already has this role for this tenant under the same scope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    User:
      type: object
      required:
        - id
        - full_name
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
