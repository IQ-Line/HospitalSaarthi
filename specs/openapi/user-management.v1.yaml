openapi: 3.1.0
info:
  title: HIMS User Management API
  version: 1.0.0
  description: >
    Tenant-scoped platform user profile, role assignment, and principal-enrichment APIs.
    Credential issuance and session lifecycle are owned by better-auth (see implementation task 1A.7);
    they are not exposed as paths in this contract.
    Tenant scope authority is JWT-derived (`iq_tenant_id` claim). If `iq_tenant_id` header is
    provided for diagnostics, it must exactly match the JWT tenant claim.
servers:
  - url: /api/user-management
security:
  - bearerAuth: []
paths:
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current authenticated user
      description: >
        Returns the tenant-scoped platform user for the authenticated session (JWT `sub`
        resolved against the `users` table). This is profile data only — not the enriched
        authorization principal; use GET /auth/principal for that.
      parameters:
        - $ref: "#/components/parameters/IqTenantIdHeader"
      responses:
        "200":
          description: Current user for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Request validation error (including tenant header/JWT mismatch when header is provided).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: User not found for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /auth/principal:
    get:
      tags:
        - Auth
      summary: Get enriched principal for authorization
      description: >
        Returns the fully enriched principal used for authorization,
        combining JWT claims with resolved authorization data.
      parameters:
        - $ref: "#/components/parameters/IqTenantIdHeader"
      responses:
        "200":
          description: Enriched principal (JWT claims plus resolved authorization data; token not included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "400":
          description: Invalid request (e.g. principal resolution failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users:
    post:
      tags:
        - Users
      summary: Create a tenant-scoped platform user record
      description: >
        Creates a row in the platform `users` table for the current tenant (`iq_tenant_id`
        is the Citus distribution key and is taken from request context, not the request body).
        Credential storage and synthetic identity anchors remain in better-auth (`ba_*`) and
        are out of scope for this request body.
      parameters:
        - $ref: "#/components/parameters/IqTenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - full_name
              properties:
                full_name:
                  type: string
                  minLength: 1
                  description: Display name for the principal (required platform profile field).
                email:
                  type: string
                  nullable: true
                  description: Business contact email (nullable, non-unique per tenant); not the better-auth synthetic anchor.
                phone:
                  type: string
                  nullable: true
                  description: Business contact phone.
                username:
                  type: string
                  nullable: true
                  description: Optional login handle; unique per tenant when set.
                org_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Organization scope (configurator organizations.id); logical reference only.
      responses:
        "201":
          description: Platform user created for the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input (e.g. malformed body or invalid field values).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a tenant-scoped user by id
      parameters:
        - $ref: "#/components/parameters/IqTenantIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Platform user id within the current tenant.
      responses:
        "200":
          description: User found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Request validation error (including tenant header/JWT mismatch when header is provided).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: User not found for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
    patch:
      tags:
        - Users
      summary: Update a tenant-scoped user
      parameters:
        - $ref: "#/components/parameters/IqTenantIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Platform user id within the current tenant.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                full_name:
                  type: string
                  minLength: 1
                  description: Display name for the principal.
                email:
                  type: string
                  nullable: true
                  description: Business contact email (nullable, non-unique per tenant); not the better-auth synthetic anchor.
                phone:
                  type: string
                  nullable: true
                  description: Business contact phone.
                username:
                  type: string
                  nullable: true
                  description: Optional login handle; unique per tenant when set.
                org_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Organization scope (configurator organizations.id); logical reference only.
                status:
                  type: string
                  enum: [active, inactive, suspended]
                  description: Platform user lifecycle state.
                auth_user_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: External identity anchor (e.g. better-auth user id) when linked.
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input (e.g. malformed body or invalid field values).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: User not found for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /role-assignments:
    post:
      tags:
        - RoleAssignments
      summary: Assign a role to a user
      description: >
        Creates a row in `role_assignments` for the current tenant. `iq_tenant_id` is taken
        from request context, not the request body.
      parameters:
        - $ref: "#/components/parameters/IqTenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - user_id
                - role_id
              properties:
                user_id:
                  type: string
                  format: uuid
                  description: Platform user id within the current tenant.
                role_id:
                  type: string
                  format: uuid
                  description: Role id within the current tenant.
      responses:
        "201":
          description: Role assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignment"
        "400":
          description: Malformed request (e.g. invalid JSON, missing required fields, or invalid UUID format).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "404":
          description: User or role not found for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "409":
          description: Duplicate role assignment (user already has this role for this tenant under the same scope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform JWT; runtime rejects missing/malformed bearer tokens and invalid/expired tokens.
  parameters:
    IqTenantIdHeader:
      name: iq_tenant_id
      in: header
      required: false
      deprecated: true
      description: >
        Optional diagnostic header. Canonical tenant scope is JWT `iq_tenant_id`.
        If this header is supplied, runtime requires exact match with JWT tenant scope.
      schema:
        type: string
        format: uuid
  schemas:
    ErrorMessage:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
        correlation_id:
          type: string
          description: Request correlation identifier.
    User:
      type: object
      required:
        - id
        - full_name
        - status
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          nullable: true
          description: Business contact email when stored.
        phone:
          type: string
          nullable: true
          description: Business contact phone when stored.
        auth_user_id:
          type: string
          format: uuid
          nullable: true
          description: External identity anchor when linked.
        username:
          type: string
          nullable: true
          description: Login handle when set.
        org_id:
          type: string
          format: uuid
          nullable: true
          description: Organization scope when set.
        status:
          type: string
          enum: [active, inactive, suspended]
          description: Platform user lifecycle state.
    Principal:
      type: object
      required:
        - id
        - roles
        - attributes
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            type: string
        attributes:
          type: object
          required:
            - iq_tenant_id
            - department
            - org_id
            - capabilities
            - delegated_capabilities
            - clearances
          properties:
            iq_tenant_id:
              type: string
            department:
              type: string
              nullable: true
            org_id:
              type: string
              nullable: true
            capabilities:
              type: array
              items:
                type: string
            delegated_capabilities:
              type: array
              items:
                type: string
            clearances:
              type: object
              additionalProperties:
                type: string
              description: Map of clearance types to levels (e.g. psychiatric, vip).
    RoleAssignment:
      type: object
      required:
        - id
        - user_id
        - role_id
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
