openapi: 3.1.0
info:
  title: HIMS Master Data API
  version: 1.0.0
  description: Read-only Master Data registry API for the first Python module learning slice.
servers:
  - url: /api/master-data
security:
  - bearerAuth: []
paths:
  /modules:
    get:
      operationId: listModules
      summary: List registered platform modules
      description: Returns deployable modules registered in the Master Data registry.
      tags:
        - Modules
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ModuleCategory"
          description: Filter modules by catalog category (not authorization).
      responses:
        "200":
          description: Registered modules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Principal is not authorized to view Master Data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Stable error code for clients.
              examples:
                - UNAUTHORIZED
            message:
              type: string
              description: Human-readable summary.
            details:
              type: object
              additionalProperties: true
              description: Optional validation or diagnostic payload.
      example:
        error:
          code: FORBIDDEN
          message: Principal is not allowed to read Master Data registry.
          details: {}
    ModuleCategory:
      type: string
      enum:
        - core
        - clinical
        - administrative
        - support
    Module:
      type: object
      required:
        - id
        - name
        - category
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples:
            - user_management
        category:
          $ref: "#/components/schemas/ModuleCategory"
        version:
          type: string
          examples:
            - 1.0.0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModuleListResponse:
      type: object
      required:
        - data
        - total
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Module"
        total:
          type: integer
          minimum: 0
