components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable error code for clients.
              examples:
              - UNAUTHORIZED
              - CONFLICT
              - BAD_REQUEST
            message:
              type: string
              description: Human-readable summary.
            details:
              type: object
              additionalProperties: true
              description: Optional validation or diagnostic payload.
      example:
        error:
          code: FORBIDDEN
          message: Principal is not allowed to mutate the Master Data registry.
          details: {}
    ModuleCategory:
      type: string
      enum:
      - core
      - clinical
      - administrative
      - support
    PermissionAction:
      type: string
      enum:
      - create
      - read
      - update
      - delete
      - manage
    PermissionCreate:
      type: object
      required:
      - name
      - slug
      - action
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
        action:
          $ref: '#/components/schemas/PermissionAction'
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          default: true
    PermissionUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
        action:
          $ref: '#/components/schemas/PermissionAction'
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_deleted:
          type: boolean
          description: Set false to restore a soft-deleted permission.
    Permission:
      type: object
      required:
      - id
      - name
      - slug
      - action
      - is_active
      - is_deleted
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: integer
          format: int32
          nullable: true
          description: Present when the row was read from tenant_master (request had iq_tenant_id).
        name:
          type: string
        slug:
          type: string
        action:
          $ref: '#/components/schemas/PermissionAction'
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_deleted:
          type: boolean
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PermissionSingleResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/Permission'
    PermissionListResponse:
      type: object
      required:
      - data
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        total:
          type: integer
          minimum: 0
    SystemRoleCreate:
      type: object
      required:
      - name
      - slug
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
          description: 'Stable template key (unique among active rows). One slug = one catalog template; use distinct slugs
            per template (e.g. `ward-clerk`, `lab-supervisor`).

            '
        description:
          type: string
          nullable: true
        is_template:
          type: boolean
          default: true
          description: 'True for platform catalog templates. Instantiated tenant roles live outside `master_data`.

            '
        is_active:
          type: boolean
          default: true
    SystemRoleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        is_template:
          type: boolean
        is_active:
          type: boolean
        is_deleted:
          type: boolean
          description: Set false to restore a soft-deleted system role.
    SystemRole:
      type: object
      required:
      - id
      - name
      - slug
      - is_template
      - is_active
      - is_deleted
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: integer
          format: int32
          nullable: true
          description: Present when the row was read from tenant_master (request had iq_tenant_id).
        name:
          type: string
        slug:
          type: string
        is_template:
          type: boolean
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_deleted:
          type: boolean
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SystemRoleSingleResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/SystemRole'
    SystemRoleListResponse:
      type: object
      required:
      - data
      - total
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'
        total:
          type: integer
          minimum: 0
    ModulePermissionCreate:
      type: object
      required:
      - slug
      - module_id
      - permission_id
      additionalProperties: false
      properties:
        slug:
          type: string
          description: 'Stable key for this link (unique among active rows). Convention: combine module and permission slugs,
            e.g. `opd--opd-create` or `opd:opd:create`.

            '
        module_id:
          type: string
          format: uuid
        permission_id:
          type: string
          format: uuid
        is_default:
          type: boolean
          default: false
          description: Suggested default when provisioning tenant templates (hint only).
        is_active:
          type: boolean
          default: true
    ModulePermissionUpdate:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        is_default:
          type: boolean
        is_active:
          type: boolean
        is_deleted:
          type: boolean
          description: Set false to restore a soft-deleted link.
    ModulePermission:
      type: object
      required:
      - id
      - slug
      - module_id
      - permission_id
      - is_default
      - is_active
      - is_deleted
      - created_at
      - updated_at
      properties:
        id:
          type: string
